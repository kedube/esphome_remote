template:
  - sensor:
      # The remote's favorite lists, so changing them doesn't mean rebuilding
      # the firmware (see Favorites from Home Assistant in the README).
      #
      # In `lists`, a line starting with # starts a list and names it; each
      # line after it is a favorite, Name|entity_id, with the optional third
      # field (a TV remote's command set, a media player's sources) after
      # another |. The remote shows them in this order. Blank lines and spaces
      # around the fields don't matter.
      #
      # After editing, reload: Developer tools > YAML > Template entities. The
      # remote's "Favorites status" sensor says whether it took the lists, and
      # what's wrong if it didn't.
      #
      # tools/favorites_to_home_assistant.py prints this sensor with the lists
      # in your local_entities.h.
      - name: Remote Favorites
        unique_id: remote_favorites
        icon: mdi:star
        state: "ok"
        attributes:
          lists: |
            #LIVING ROOM
            Lamp|light.living_room_lamp
            Thermostat|climate.main_thermostat
            Front Door|lock.front_door
            Speaker|media_player.living_room_speaker|Spotify|Radio|Line In
            Apple TV|remote.living_room_apple_tv|apple_tv
            Home Alarm|alarm_control_panel.home
            #KITCHEN
            Ceiling Light|light.kitchen_ceiling
            Coffee Maker|switch.coffee_maker
            Garage Door|cover.garage_door
            Indoor Temperature|sensor.indoor_temperature
            Local Weather|weather.forecast_home
            Evening Scene|scene.evening
            Pasta Timer|timer.kitchen
            #HOUSE
            Guest Mode|input_boolean.guest_mode
            TV Power|button.living_room_tv_power
            Speaker Bass|number.living_room_speaker_bass
            House Mode|input_select.house_mode
            Robot Vacuum|vacuum.robot
            Garden Water|valve.garden
            Alex|person.alex
            Doorbell|event.front_doorbell_ring
