name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly build so ESPHome releases that break the config surface here rather
    # than the next time someone tries to flash a remote.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

  firmware:
    name: Firmware (${{ matrix.pcb }})
    runs-on: ubuntu-latest

    # Every PCB revision selects different pins, so a change that compiles for
    # one can still break another. Build them all.
    strategy:
      fail-fast: false
      matrix:
        pcb:
          - pcb_rev1
          - pcb_rev2
          - pcb_rev31

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Generate CI configuration
        # secrets.yaml and local_entities.h are gitignored (they hold each
        # owner's credentials and entity list), so CI builds against the
        # committed examples with throwaway values.
        run: python .github/scripts/prepare_ci_config.py --pcb ${{ matrix.pcb }}

      - name: Cache ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            esphome/.esphome
          key: esphome-${{ matrix.pcb }}-${{ hashFiles('requirements.txt') }}-${{ hashFiles('esphome/**/*.yaml', 'include/**', 'src/**') }}
          restore-keys: |
            esphome-${{ matrix.pcb }}-${{ hashFiles('requirements.txt') }}-
            esphome-${{ matrix.pcb }}-

      - name: Validate configuration
        run: esphome config esphome/remote_control.yaml

      - name: Compile firmware
        run: esphome compile esphome/remote_control.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.pcb }}
          path: |
            esphome/.esphome/build/*/build/*.factory.bin
            esphome/.esphome/build/*/build/*.ota.bin
          if-no-files-found: error
          retention-days: 14
