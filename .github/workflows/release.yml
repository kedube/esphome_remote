name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = re-release current settings.yaml version)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - minor
          - major
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  release:
    name: Bump version and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Skip stale workflow runs
        id: head_check
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BUMP_INPUT: ${{ inputs.bump || 'none' }}
        run: |
          current_sha="$(git rev-parse origin/main)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUMP_INPUT" = "none" ]; then
              echo "release_action=existing" >> "$GITHUB_OUTPUT"
            else
              echo "release_action=bump" >> "$GITHUB_OUTPUT"
            fi
            echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "release_action=bump" >> "$GITHUB_OUTPUT"
            echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha="$(git rev-parse "$current_sha^")"
          latest_subject="$(git log -1 --format=%s "$current_sha")"
          if [ "$previous_sha" = "$EXPECTED_SHA" ] && [[ "$latest_subject" == chore\(release\):*\ \[skip\ ci\] ]]; then
            echo "release_action=existing" >> "$GITHUB_OUTPUT"
            echo "release_target=$current_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping stale run for $EXPECTED_SHA because main is already at $current_sha."
          echo "release_action=skip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.head_check.outputs.release_action != 'skip'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Bump version and rotate changelog
        if: steps.head_check.outputs.release_action == 'bump'
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump || 'minor' }}
        run: |
          new_version="$(python .github/scripts/bump_version.py --bump "$BUMP_TYPE")"
          python .github/scripts/update_changelog.py "$new_version"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Read existing version
        if: steps.head_check.outputs.release_action == 'existing'
        id: current_version
        run: |
          new_version="$(python .github/scripts/read_version.py)"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        if: steps.head_check.outputs.release_action == 'bump'
        id: commit_release
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esphome/settings.yaml CHANGELOG.md
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          echo "release_target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push release commit
        if: steps.head_check.outputs.release_action == 'bump'
        run: git push origin HEAD:main

      # No firmware binaries are published. WiFi credentials and the API encryption
      # key are baked in at compile time from each owner's secrets.yaml, so a
      # pre-built image can't be adopted by anyone else — everyone compiles their
      # own. CI still builds every PCB revision on each push to prove the config
      # compiles. Ship the source instead, archived from the release commit so the
      # version string in settings.yaml matches the tag.
      - name: Package release source
        if: steps.head_check.outputs.release_action != 'skip'
        id: source_archive
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
          RELEASE_TARGET: ${{ steps.commit_release.outputs.release_target || steps.head_check.outputs.release_target }}
        run: |
          set -euo pipefail
          mkdir -p release_artifacts
          name="esphome-remote-${NEW_VERSION}"
          git archive --format=zip --prefix="${name}/" \
            -o "release_artifacts/${name}-source.zip" "$RELEASE_TARGET"
          ls -l release_artifacts

      # GitHub's auto-generated notes only list merged PRs, so direct-to-main releases came
      # out empty. Build the body ourselves: Highlights from CHANGELOG.md (rotated from its
      # Unreleased section during the bump) plus the commit list since the previous tag.
      - name: Generate release notes
        if: steps.head_check.outputs.release_action != 'skip'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
        run: python .github/scripts/generate_release_notes.py "$NEW_VERSION" release_notes.md

      - name: Create GitHub release
        if: steps.head_check.outputs.release_action != 'skip'
        uses: actions/github-script@v9
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version || steps.current_version.outputs.new_version }}
          RELEASE_TARGET: ${{ steps.commit_release.outputs.release_target || steps.head_check.outputs.release_target }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const tag = process.env.NEW_VERSION
            const target = process.env.RELEASE_TARGET
            const body = fs.readFileSync('release_notes.md', 'utf8')
            const { owner, repo } = context.repo

            let release
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data
              core.info(`Release ${tag} already exists; reusing it for asset upload.`)
            } catch (error) {
              if (error.status !== 404) {
                throw error
              }
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: tag,
                body,
              })).data
            }

            const dir = 'release_artifacts'
            for (const name of fs.readdirSync(dir)) {
              const existing = release.assets?.find((asset) => asset.name === name)
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                })
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(path.join(dir, name)),
              })
              core.info(`Uploaded ${name}`)
            }
