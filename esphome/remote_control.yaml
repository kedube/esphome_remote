substitutions:
  ALARM_CODE: !secret alarm_code
  PIN_WAKE: "0"
  PIN_I2C_SDA: "27"
  PIN_I2C_SCL: "25"
  PIN_BTN_NEXT: "33"
  PIN_BTN_PREV: "22"
  PIN_BTN_MODE: "14"
  PIN_BTN_SETTINGS: "26"
  PIN_BTN_SQUARE: "23"
  PIN_BTN_MINUS: "19"
  PIN_BTN_PLUS: "18"

packages:
  settings: !include settings.yaml
  remote_fonts: !include packages/remote_fonts.yaml
  remote_display_runtime_globals: !include packages/remote_display_runtime_globals.yaml
  remote_display_selection_globals: !include packages/remote_display_selection_globals.yaml
  remote_display_state_globals: !include packages/remote_display_state_globals.yaml
  remote_inputs: !include packages/remote_inputs.yaml
  remote_runtime: !include packages/remote_runtime.yaml
  remote_ui_setup_scripts: !include packages/remote_ui_setup_scripts.yaml
  remote_ui_selection_scripts: !include packages/remote_ui_selection_scripts.yaml
  remote_ui_navigation_actions: !include packages/remote_ui_navigation_actions.yaml
  remote_actions_feedback: !include packages/remote_actions_feedback.yaml
  remote_actions_devices: !include packages/remote_actions_devices.yaml
  remote_actions_security: !include packages/remote_actions_security.yaml
  remote_actions_climate_media: !include packages/remote_actions_climate_media.yaml
  remote_actions_automation: !include packages/remote_actions_automation.yaml
  remote_button_press_scripts: !include packages/remote_button_press_scripts.yaml
  remote_button_action_scripts: !include packages/remote_button_action_scripts.yaml
  remote_display_scripts: !include packages/remote_display_scripts.yaml

esphome:
  name: ${DEVICE_NAME}
  friendly_name: ${FRIENDLY_NAME}
  min_version: 2026.1.0
  name_add_mac_suffix: false
  build_flags:
    - -DREMOTE_FRAMEBUFFER_WEB_DEBUG=${FRAMEBUFFER_WEB_DEBUG}
    - -DREMOTE_NOTIFICATION_FEED_MAX_ITEMS=${NOTIFICATION_FEED_MAX_ITEMS}
    - -DREMOTE_MAX_PERSISTED_FAVORITE_LISTS=${MAX_PERSISTED_FAVORITE_LISTS}
  includes:
    # Releases the deep-sleep GPIO hold on the OLED enable pin. This is a fix,
    # not instrumentation — keep it when removing debug code.
    - oled_hold_release.h
    - ../include/entity_helpers.h
    - ../include/entity_trackers.h
    - ../include/entity_helpers_common.h
    - ../include/remote_ui_bindings.h
    - ../include/remote_ui_feedback.h
    - ../include/remote_ui_input_logic.h
    - ../include/remote_ui_logic.h
    - ../include/ui_state_helpers.h
    - ../include/remote_ui_renderer.h
    - ../include/remote_ui_sync.h
    - ../include/remote_ui_runtime.h
    - ../include/entity_helpers_requests.h
    - ../include/framebuffer_web_debug.h
    - ../src/framebuffer_web_debug.cpp
    - ../src/remote_ui_feedback.cpp
    - ../src/remote_ui_input_logic.cpp
    - ../src/remote_ui_logic.cpp
    - ../src/remote_ui_renderer.cpp
    - ../src/remote_ui_sync.cpp
    - ../src/remote_ui_runtime.cpp
    - local_entities.h
  on_boot:
    # Bind the C++ UI helpers to the globals before any script can use them.
    - priority: 1000
      then:
        - lambda: |-
            RemoteUiBindings &b = remote_ui_bindings;
            b.selected_item_name = &id(selected_item_name);
            b.selected_item_entity = &id(selected_item_entity);
            b.selected_item_state = &id(selected_item_state);
            b.selected_brightness_pct = &id(selected_brightness_pct);
            b.selected_fan_speed_pct = &id(selected_fan_speed_pct);
            b.selected_humidifier_target_humidity = &id(selected_humidifier_target_humidity);
            b.selected_humidifier_current_humidity = &id(selected_humidifier_current_humidity);
            b.selected_humidifier_action = &id(selected_humidifier_action);
            b.selected_humidifier_mode = &id(selected_humidifier_mode);
            b.selected_cover_position_pct = &id(selected_cover_position_pct);
            b.last_switch_feedback = &id(last_switch_feedback);
            b.last_switch_interaction = &id(last_switch_interaction);
            b.selected_climate_target_temp = &id(selected_climate_target_temp);
            b.selected_water_heater_target_temp = &id(selected_water_heater_target_temp);
            b.selected_climate_hvac_action = &id(selected_climate_hvac_action);
            b.selected_climate_fan_mode = &id(selected_climate_fan_mode);
            b.selected_climate_preset = &id(selected_climate_preset);
            b.selected_climate_target_temp_low = &id(selected_climate_target_temp_low);
            b.selected_climate_target_temp_high = &id(selected_climate_target_temp_high);
            b.selected_climate_current_temp = &id(selected_climate_current_temp);
            b.selected_climate_target_humidity = &id(selected_climate_target_humidity);
            b.selected_water_heater_mode = &id(selected_water_heater_mode);
            b.selected_water_heater_away = &id(selected_water_heater_away);
            b.climate_target_focus = &id(climate_target_focus);
            b.climate_target_focus_value = &id(climate_target_focus_value);
            b.last_climate_target_focus_interaction = &id(last_climate_target_focus_interaction);
            b.selected_media_volume_pct = &id(selected_media_volume_pct);
            b.selected_media_title = &id(selected_media_title);
            b.selected_media_artist = &id(selected_media_artist);
            b.selected_media_device_class = &id(selected_media_device_class);
            b.selected_media_source = &id(selected_media_source);
            b.selected_media_shuffle = &id(selected_media_shuffle);
            b.selected_media_repeat = &id(selected_media_repeat);
            b.selected_media_sound_mode = &id(selected_media_sound_mode);
            b.last_media_power_feedback = &id(last_media_power_feedback);
            b.last_alarm_feedback = &id(last_alarm_feedback);
            b.last_alarm_interaction = &id(last_alarm_interaction);
            b.last_lock_feedback = &id(last_lock_feedback);
            b.last_lock_interaction = &id(last_lock_interaction);
            b.last_cover_feedback = &id(last_cover_feedback);
            b.last_cover_interaction = &id(last_cover_interaction);
            b.last_cover_position_interaction = &id(last_cover_position_interaction);
            b.primary_button_press_started_at = &id(primary_button_press_started_at);
            b.play_pause_button_press_started_at = &id(play_pause_button_press_started_at);
            b.settings_button_press_started_at = &id(settings_button_press_started_at);
            b.primary_button_press_mode = &id(primary_button_press_mode);
            b.play_pause_button_press_mode = &id(play_pause_button_press_mode);
            b.settings_button_press_mode = &id(settings_button_press_mode);
            b.primary_button_long_press_fired = &id(primary_button_long_press_fired);
            b.play_pause_button_long_press_fired = &id(play_pause_button_long_press_fired);
            b.settings_button_long_press_fired = &id(settings_button_long_press_fired);
            b.selected_weather_temperature = &id(selected_weather_temperature);
            b.selected_weather_humidity = &id(selected_weather_humidity);
            b.selected_weather_high_temp = &id(selected_weather_high_temp);
            b.selected_weather_low_temp = &id(selected_weather_low_temp);
            b.selected_weather_wind_speed = &id(selected_weather_wind_speed);
            b.selected_weather_wind_bearing = &id(selected_weather_wind_bearing);
            b.selected_weather_wind_gust_speed = &id(selected_weather_wind_gust_speed);
            b.selected_weather_pressure = &id(selected_weather_pressure);
            b.selected_weather_cloud_coverage = &id(selected_weather_cloud_coverage);
            b.selected_weather_uv_index = &id(selected_weather_uv_index);
            b.selected_weather_dew_point = &id(selected_weather_dew_point);
            b.selected_weather_apparent_temperature = &id(selected_weather_apparent_temperature);
            b.selected_weather_precipitation = &id(selected_weather_precipitation);
            b.selected_weather_condition = &id(selected_weather_condition);
            b.selected_sensor_unit = &id(selected_sensor_unit);
            b.selected_setting_detail = &id(selected_setting_detail);
            b.selected_notification_index = &id(selected_notification_index);
            b.updated_ui = &id(updated_ui);
            remote_ui_bindings_bound = true;
    - priority: 250
      then:
        - lambda: |-
            id(last_active) = millis() / 1000;
            PersistedUIStateData restored = unpack_persisted_ui_state(id(persisted_ui_state), id(persisted_ui_state_aux));

            if (menu_index_is_favorite(restored.current_menu_index) && restored.current_menu_index < FAVORITE_LIST_COUNT_INT) {
              favorite_selected_index_ref(restored.current_menu_index) = restored.current_favorite_index;
            }
            id(selected_notification_index) = restored.selected_notification_index;
            id(selected_info_index) = restored.selected_info_index;
            id(selected_setting_option) = restored.selected_setting_option;
            id(selected_weather_detail_index) = restored.selected_weather_detail_index;
            id(selected_alarm_arm_mode) = static_cast<int>(clamp_alarm_arm_mode(restored.selected_alarm_arm_mode));

            if (restored.contrast >= 1 && restored.contrast <= 10) {
              id(contrast) = restored.contrast;
            } else {
              id(contrast) = 5;
            }
            id(oled_display).set_contrast(id(contrast) * 1.0f / 10.0f);

            id(current_menu_index) = clamp_menu_index(restored.current_menu_index);
            id(current_mode) = restored.current_mode >= 0 && restored.current_mode < REMOTE_MODE_COUNT
                ? restored.current_mode
                : REMOTE_MODE_INFO;

            // Register Home Assistant subscriptions only now that the selection is
            // restored, so the item the remote wakes into is announced first.
            ensure_remote_status_trackers(tracker_subscription_order_for_menu(id(current_menu_index)));
            id(updated_ui) = true;
        - script.execute: update_selected_item
    - priority: -100
      then:
        - lambda: |-
            register_framebuffer_web_debug(id(oled_display));

preferences:
  flash_write_interval: 5s

esp32:
  board: ${BOARD}
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: arduino
    advanced:
      # Must not exceed the chip revision of the board being flashed. The
      # bootloader verifies this when finishing an OTA, so a value that is too
      # high fails the update after the image has fully transferred.
      minimum_chip_revision: "3.0"
      # Maps SRAM1 as IRAM (+40KB of code space) at the cost of an equivalent
      # amount of heap. Requires the rev 3 bootloader, which the pinned chip
      # revision above already guarantees.
      sram1_as_iram: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB
  fast_connect: true
  power_save_mode: LIGHT

api:
  homeassistant_states: true
  reboot_timeout: 0s
  encryption:
    key: !secret encryption_key

json:

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - lambda: |-
            id(updated_ui) = true;
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              id(updated_ui) = true;

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  boot_is_good_after: ${SAFE_MODE_BOOT_IS_GOOD_AFTER}

logger:
  level: INFO # DEBUG
  baud_rate: 0 # Disable logging over UART

deep_sleep:
  id: go_sleep
  run_duration: ${DEEP_SLEEP_DURATION}
  wakeup_pin:
    number: ${PIN_WAKE}
    allow_other_uses: true
    ignore_strapping_warning: true
  wakeup_pin_mode: INVERT_WAKEUP

i2c:
  sda: ${PIN_I2C_SDA}
  scl: ${PIN_I2C_SCL}
  frequency: 400kHz
  scan: false

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 180
    contrast: 0.5
    id: oled_display
