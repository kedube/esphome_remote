script:
  # Lock, cover and alarm actions take the tracker index of the device that was
  # pressed: the result is checked on that device, and an answer from Home
  # Assistant that arrives after the user has moved on doesn't land on another.
  # Every script whose Home Assistant action waits for an answer takes a single
  # int, the device's index: ESPHome 2026.9 numbers those requests per
  # parameter list, so scripts with different lists would reuse the same
  # numbers and could receive each other's answers.
  - id: lock_selected_lock
    mode: queued
    parameters:
      lock_index: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = selected_lock_state(lock_index);
              return state == "locked" || state == "locking";
          then:
            - script.execute:
                id: set_lock_feedback
                feedback: !lambda |-
                  return selected_lock_state(lock_index) == "locking" ? std::string("LOCKING...")
                                                                      : std::string("ALREADY LOCKED");
            - script.stop: lock_selected_lock
      - script.execute:
          id: set_lock_feedback
          feedback: "LOCKING..."
      # Home Assistant only answers a rejected request: a lock that fails on its
      # own never gets a reply. So the lock's state is checked from now on.
      - script.execute:
          id: verify_selected_lock_result
          lock_index: !lambda 'return lock_index;'
          locking: true
          start_state: !lambda 'return selected_lock_state(lock_index);'
      - homeassistant.action:
          action: lock.lock
          data:
            entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_LOCKS, lock_index));'
          on_error:
            - if:
                condition:
                  lambda: 'return id(current_mode) == REMOTE_MODE_LOCKS && id(selected_lock_index) == lock_index;'
                then:
                  - script.stop: verify_selected_lock_result
                  - script.execute:
                      id: set_lock_feedback
                      feedback: "LOCK FAILED"

  # "open" (unlatched) counts as unlocked.
  - id: unlock_selected_lock
    mode: queued
    parameters:
      lock_index: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = selected_lock_state(lock_index);
              return lock_state_unlocked(state) || state == "unlocking" || state == "opening";
          then:
            - script.execute:
                id: set_lock_feedback
                feedback: !lambda |-
                  const std::string &state = selected_lock_state(lock_index);
                  return std::string(state == "unlocking" ? "UNLOCKING..."
                                     : state == "opening" ? "OPENING..."
                                     : state == "open"    ? "ALREADY OPEN"
                                                          : "ALREADY UNLOCKED");
            - script.stop: unlock_selected_lock
      - script.execute:
          id: set_lock_feedback
          feedback: "UNLOCKING..."
      - script.execute:
          id: verify_selected_lock_result
          lock_index: !lambda 'return lock_index;'
          locking: false
          start_state: !lambda 'return selected_lock_state(lock_index);'
      - homeassistant.action:
          action: lock.unlock
          data:
            entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_LOCKS, lock_index));'
          on_error:
            - if:
                condition:
                  lambda: 'return id(current_mode) == REMOTE_MODE_LOCKS && id(selected_lock_index) == lock_index;'
                then:
                  - script.stop: verify_selected_lock_result
                  - script.execute:
                      id: set_lock_feedback
                      feedback: "UNLOCK FAILED"

  # The verifiers poll the tracker for the device that was acted on. Once the
  # user selects a different item its feedback has been reset, so they stop
  # quietly rather than report one device's result on another. start_state is
  # the device's state when the command went out: a lock that was already
  # jammed isn't taken to have jammed again until the time is up.
  - id: verify_selected_lock_result
    mode: restart
    parameters:
      lock_index: int
      locking: bool
      start_state: std::string
    then:
      - lambda: |-
          id(lock_verification_complete) = false;
      # Up to 15 s: slow and cloud locks can take a while to report.
      - repeat:
          count: 15
          then:
            - if:
                condition:
                  lambda: 'return !id(lock_verification_complete);'
                then:
                  - delay: 1000ms
                  - lambda: |-
                      if (id(current_mode) != REMOTE_MODE_LOCKS || id(selected_lock_index) != lock_index) {
                        id(lock_verification_complete) = true;
                        return;
                      }
                      auto progress = evaluate_lock_request(locking, selected_lock_state(lock_index), start_state, false);
                      id(set_lock_feedback).execute(progress.feedback);
                      id(lock_verification_complete) = progress.complete;
      - lambda: |-
          if (id(lock_verification_complete)) {
            return;
          }
          id(lock_verification_complete) = true;
          if (id(current_mode) != REMOTE_MODE_LOCKS || id(selected_lock_index) != lock_index) {
            return;
          }
          // Still moving says so; anything else short of the goal didn't take.
          auto progress = evaluate_lock_request(locking, selected_lock_state(lock_index), start_state, true);
          id(set_lock_feedback).execute(progress.feedback);

  # start_position is where the cover was when the command went out (NAN for
  # one that doesn't report a position): one that ends part-way after moving
  # stopped there, one that never moved didn't take the command.
  - id: verify_selected_cover_result
    mode: restart
    parameters:
      cover_index: int
      opening: bool
      start_position: float
    then:
      - lambda: |-
          id(cover_verification_complete) = false;
      # Up to 20 s: garage doors and long shades take a while to travel.
      - repeat:
          count: 20
          then:
            - if:
                condition:
                  lambda: 'return !id(cover_verification_complete);'
                then:
                  - delay: 1000ms
                  - lambda: |-
                      if (id(current_mode) != REMOTE_MODE_COVERS || id(selected_cover_index) != cover_index) {
                        id(cover_verification_complete) = true;
                        return;
                      }
                      auto progress = evaluate_cover_request(opening, selected_cover_state(cover_index),
                                                             selected_cover_position(cover_index), start_position, false);
                      id(set_cover_feedback).execute(progress.feedback);
                      id(cover_verification_complete) = progress.complete;
      - lambda: |-
          if (id(cover_verification_complete)) {
            return;
          }
          id(cover_verification_complete) = true;
          if (id(current_mode) != REMOTE_MODE_COVERS || id(selected_cover_index) != cover_index) {
            return;
          }
          auto progress = evaluate_cover_request(opening, selected_cover_state(cover_index),
                                                 selected_cover_position(cover_index), start_position, true);
          id(set_cover_feedback).execute(progress.feedback);

  # Checked every second from the moment the request goes out, so the footer
  # keeps saying ARMING... through an exit delay and catches a state that
  # doesn't last. The panel has ALARM_STATUS_UPDATE_DELAY_MS to reach the
  # requested state or start counting down to it, else FAILED; a countdown is
  # then followed for up to 3 minutes.
  - id: verify_selected_alarm_result
    mode: restart
    parameters:
      request: int
    then:
      - lambda: |-
          id(alarm_verification_complete) = false;
          id(alarm_verification_started_at) = millis();
      - while:
          condition:
            lambda: 'return !id(alarm_verification_complete);'
          then:
            - delay: 1000ms
            - lambda: |-
                int alarm_index = alarm_request_index(request);
                if (id(current_mode) != REMOTE_MODE_ALARMS || id(selected_alarm_index) != alarm_index) {
                  id(alarm_verification_complete) = true;
                  return;
                }
                auto progress = evaluate_alarm_request(alarm_request_kind(request), alarm_state_for_index(alarm_index),
                                                       millis() - id(alarm_verification_started_at),
                                                       ${ALARM_STATUS_UPDATE_DELAY_MS}, 180000);
                id(set_alarm_feedback).execute(progress.feedback);
                id(alarm_verification_complete) = progress.complete;

  # Plus/Minus in the footer's arm-mode picker, over the modes this panel
  # supports. Only redraws: a feedback toast would cover the picker.
  - id: shift_selected_alarm_arm_mode
    parameters:
      step: int
    then:
      - lambda: |-
          int features = alarm_supported_features_for_index(id(selected_alarm_index));
          AlarmArmMode current = alarm_effective_arm_mode(id(selected_alarm_arm_mode), features);
          AlarmArmMode next_mode = next_supported_alarm_arm_mode(current, step, features);
          id(selected_alarm_arm_mode) = static_cast<int>(next_mode);
          id(selected_setting_detail) = std::string(alarm_arm_mode_selection_label(next_mode));
          id(updated_ui) = true;
      - script.execute: update_display

  # Sends a request made with encode_alarm_request() (the panel's index and
  # what to do, in one int; see lock_selected_lock), after showing where the
  # panel is going. That transition state is held for a few seconds like other
  # commands, so a quick second press checks it rather than the panel's
  # not-yet-updated state.
  - id: request_alarm_action
    mode: queued
    parameters:
      request: int
    then:
      - lambda: |-
          AlarmRequest kind = alarm_request_kind(request);
          const char *transition = alarm_request_transition_state(kind);
          if (transition[0] != '\0') {
            id(selected_item_state) = transition;
            note_local_change();
          }
          id(updated_ui) = true;
          id(set_alarm_feedback).execute(alarm_request_progress_feedback(kind));
      # Home Assistant only answers a rejected request, never a panel that fails
      # on its own, so the panel's state is checked from now on.
      - script.execute:
          id: verify_selected_alarm_result
          request: !lambda 'return request;'
      - if:
          condition:
            lambda: 'return !std::string("${ALARM_CODE}").empty();'
          then:
            - homeassistant.action:
                action: !lambda 'return std::string(alarm_request_action(alarm_request_kind(request)));'
                data:
                  entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_ALARMS, alarm_request_index(request)));'
                  code: "${ALARM_CODE}"
                on_error:
                  - if:
                      condition:
                        lambda: |-
                          return id(current_mode) == REMOTE_MODE_ALARMS &&
                                 id(selected_alarm_index) == alarm_request_index(request);
                      then:
                        - script.stop: verify_selected_alarm_result
                        - script.execute:
                            id: set_alarm_feedback
                            feedback: "FAILED"
          else:
            - homeassistant.action:
                action: !lambda 'return std::string(alarm_request_action(alarm_request_kind(request)));'
                data:
                  entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_ALARMS, alarm_request_index(request)));'
                on_error:
                  - if:
                      condition:
                        lambda: |-
                          return id(current_mode) == REMOTE_MODE_ALARMS &&
                                 id(selected_alarm_index) == alarm_request_index(request);
                      then:
                        - script.stop: verify_selected_alarm_result
                        - script.execute:
                            id: set_alarm_feedback
                            feedback: "FAILED"

  # Circle: arm in the mode the footer shows. A panel Home Assistant reports
  # as "unknown" can still be armed; one that hasn't synced can't.
  - id: arm_selected_alarm_with_selected_mode
    then:
      - lambda: |-
          int alarm_index = id(selected_alarm_index);
          const std::string &state = id(selected_item_state);
          AlarmArmMode arm_mode =
              alarm_effective_arm_mode(id(selected_alarm_arm_mode), alarm_supported_features_for_index(alarm_index));
          AlarmRequest request = alarm_request_for_arm_mode(arm_mode);
          if (state.empty() || state == "unavailable") {
            id(set_alarm_feedback).execute(missing_state_word(state));
            return;
          }
          if (state == alarm_request_expected_state(request)) {
            id(set_alarm_feedback).execute("ALREADY ARMED");
            return;
          }
          id(request_alarm_action).execute(encode_alarm_request(alarm_index, request));

  - id: disarm_selected_alarm
    mode: queued
    then:
      - lambda: |-
          const std::string &state = id(selected_item_state);
          if (state.empty() || state == "unavailable") {
            id(set_alarm_feedback).execute(missing_state_word(state));
            return;
          }
          if (state == "disarmed") {
            id(set_alarm_feedback).execute("ALREADY DISARMED");
            return;
          }
          id(request_alarm_action).execute(encode_alarm_request(id(selected_alarm_index), ALARM_REQUEST_DISARM));

  # Settings held. Only offered on a panel that supports trigger.
  - id: trigger_selected_alarm
    mode: queued
    then:
      - lambda: |-
          int alarm_index = id(selected_alarm_index);
          const std::string &state = id(selected_item_state);
          if (state.empty() || state == "unavailable") {
            id(set_alarm_feedback).execute(missing_state_word(state));
            return;
          }
          if (!alarm_trigger_supported(alarm_supported_features_for_index(alarm_index))) {
            id(set_alarm_feedback).execute("CAN'T TRIGGER");
            return;
          }
          if (state == "triggered") {
            id(set_alarm_feedback).execute("ALREADY TRIGGERED");
            return;
          }
          id(request_alarm_action).execute(encode_alarm_request(alarm_index, ALARM_REQUEST_TRIGGER));

  - id: open_selected_cover
    mode: queued
    parameters:
      cover_index: int
    then:
      - script.execute:
          id: set_cover_feedback
          feedback: "OPENING..."
      # As with locks, the cover's state is checked from now on: Home Assistant
      # never answers for a device that fails on its own.
      - script.execute:
          id: verify_selected_cover_result
          cover_index: !lambda 'return cover_index;'
          opening: true
          start_position: !lambda 'return selected_cover_position(cover_index);'
      - lambda: |-
          if (id(selected_cover_position_pct) <= 0) {
            id(selected_cover_position_pct) = 100;
          }
          id(updated_ui) = true;
      - homeassistant.action:
          action: cover.open_cover
          data:
            entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_COVERS, cover_index));'
          on_error:
            - if:
                condition:
                  lambda: 'return id(current_mode) == REMOTE_MODE_COVERS && id(selected_cover_index) == cover_index;'
                then:
                  - script.stop: verify_selected_cover_result
                  - script.execute:
                      id: set_cover_feedback
                      feedback: "OPEN FAILED"

  - id: close_selected_cover
    mode: queued
    parameters:
      cover_index: int
    then:
      - script.execute:
          id: set_cover_feedback
          feedback: "CLOSING..."
      - script.execute:
          id: verify_selected_cover_result
          cover_index: !lambda 'return cover_index;'
          opening: false
          start_position: !lambda 'return selected_cover_position(cover_index);'
      - homeassistant.action:
          action: cover.close_cover
          data:
            entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_COVERS, cover_index));'
          on_error:
            - if:
                condition:
                  lambda: 'return id(current_mode) == REMOTE_MODE_COVERS && id(selected_cover_index) == cover_index;'
                then:
                  - script.stop: verify_selected_cover_result
                  - script.execute:
                      id: set_cover_feedback
                      feedback: "CLOSE FAILED"

  - id: increase_cover_position
    mode: queued
    then:
      - lambda: |-
          int next = id(selected_cover_position_pct) + 10;
          if (next > 100) next = 100;
          if (next < 10) next = 10;
          id(selected_cover_position_pct) = next;
          id(selected_item_state) = next >= 100 ? "open" : "opening";
          id(last_cover_position_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            position: !lambda 'return id(selected_cover_position_pct);'
      - script.execute: update_display

  - id: decrease_cover_position
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_cover_position_pct) <= 10;'
          then:
            - homeassistant.service:
                service: cover.close_cover
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_cover_position_pct) = 0;
                id(selected_item_state) = "closed";
                id(last_cover_position_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            - lambda: |-
                int next = id(selected_cover_position_pct) - 10;
                if (next < 1) next = 1;
                id(selected_cover_position_pct) = next;
                id(selected_item_state) = "closing";
                id(last_cover_position_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: cover.set_cover_position
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  position: !lambda 'return id(selected_cover_position_pct);'
            - script.execute: update_display

  - id: increase_cover_tilt
    mode: queued
    then:
      - lambda: |-
          float current = cover_tilt_sent_recently(millis(), id(selected_cover_index))
                              ? id(pending_cover_tilt_pct)
                              : selected_cover_tilt(id(selected_cover_index));
          if (isnan(current)) {
            current = 0.0f;
          }
          int next = int(current + 10.0f);
          if (next > 100) next = 100;
          id(pending_cover_tilt_pct) = next;
          note_cover_tilt_sent(id(selected_cover_index));
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TILT %d%%", next);
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_tilt_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            tilt_position: !lambda 'return id(pending_cover_tilt_pct);'
      - script.execute: update_display

  - id: decrease_cover_tilt
    mode: queued
    then:
      - lambda: |-
          float current = cover_tilt_sent_recently(millis(), id(selected_cover_index))
                              ? id(pending_cover_tilt_pct)
                              : selected_cover_tilt(id(selected_cover_index));
          if (isnan(current)) {
            current = 100.0f;
          }
          int next = int(current - 10.0f);
          if (next < 0) next = 0;
          id(pending_cover_tilt_pct) = next;
          note_cover_tilt_sent(id(selected_cover_index));
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TILT %d%%", next);
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_tilt_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            tilt_position: !lambda 'return id(pending_cover_tilt_pct);'
      - script.execute: update_display
