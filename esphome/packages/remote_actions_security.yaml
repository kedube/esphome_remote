script:
  # Lock and cover actions take the tracker index of the device that was
  # pressed, so the verification below checks that device even if the HA
  # response arrives after the user has moved on.
  - id: lock_selected_lock
    mode: queued
    parameters:
      lock_index: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = selected_lock_state(lock_index);
              return state == "locked" || state == "locking";
          then:
            - script.execute:
                id: set_lock_feedback
                feedback: !lambda |-
                  return selected_lock_state(lock_index) == "locking" ? std::string("LOCKING...")
                                                                      : std::string("ALREADY LOCKED");
            - script.stop: lock_selected_lock
      - script.execute:
          id: set_lock_feedback
          feedback: "LOCKING..."
      # Home Assistant only answers a rejected request: a lock that fails on its
      # own never gets a reply. So the lock's state is checked from now on.
      - homeassistant.action:
          action: lock.lock
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
          on_error:
            - script.stop: verify_selected_lock_result
            - script.execute:
                id: set_lock_feedback
                feedback: "LOCK FAILED"
      - script.execute:
          id: verify_selected_lock_result
          lock_index: !lambda 'return lock_index;'
          expected_state: "locked"
          success_feedback: "LOCKED"
          pending_feedback: "LOCKING..."
          failure_feedback: "LOCK FAILED"

  - id: unlock_selected_lock
    mode: queued
    parameters:
      lock_index: int
    then:
      - if:
          condition:
            lambda: |-
              const std::string &state = selected_lock_state(lock_index);
              return state == "unlocked" || state == "unlocking";
          then:
            - script.execute:
                id: set_lock_feedback
                feedback: !lambda |-
                  return selected_lock_state(lock_index) == "unlocking" ? std::string("UNLOCKING...")
                                                                        : std::string("ALREADY UNLOCKED");
            - script.stop: unlock_selected_lock
      - script.execute:
          id: set_lock_feedback
          feedback: "UNLOCKING..."
      # Home Assistant only answers a rejected request: a lock that fails on its
      # own never gets a reply. So the lock's state is checked from now on.
      - homeassistant.action:
          action: lock.unlock
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
          on_error:
            - script.stop: verify_selected_lock_result
            - script.execute:
                id: set_lock_feedback
                feedback: "UNLOCK FAILED"
      - script.execute:
          id: verify_selected_lock_result
          lock_index: !lambda 'return lock_index;'
          expected_state: "unlocked"
          success_feedback: "UNLOCKED"
          pending_feedback: "UNLOCKING..."
          failure_feedback: "UNLOCK FAILED"

  # The verifiers poll the tracker for the device that was acted on. Once the
  # user selects a different item its feedback has been reset, so they stop
  # quietly rather than report one device's result on another.
  - id: verify_selected_lock_result
    mode: restart
    parameters:
      lock_index: int
      expected_state: std::string
      success_feedback: std::string
      pending_feedback: std::string
      failure_feedback: std::string
    then:
      - lambda: |-
          id(lock_verification_complete) = false;
      # Up to 15 s: slow and cloud locks can take a while to report.
      - repeat:
          count: 15
          then:
            - if:
                condition:
                  lambda: 'return !id(lock_verification_complete);'
                then:
                  - delay: 1000ms
                  - lambda: |-
                      if (id(current_mode) != REMOTE_MODE_LOCKS || id(selected_lock_index) != lock_index) {
                        id(lock_verification_complete) = true;
                        return;
                      }
                      auto result = evaluate_lock_verification(selected_lock_state(lock_index), expected_state,
                                                               success_feedback);
                      // Nothing reported yet: keep saying the command is on its way.
                      id(set_lock_feedback).execute(result.feedback.empty() ? pending_feedback : result.feedback);
                      id(lock_verification_complete) = result.complete;
      - lambda: |-
          if (id(lock_verification_complete)) {
            return;
          }
          id(lock_verification_complete) = true;
          if (id(current_mode) != REMOTE_MODE_LOCKS || id(selected_lock_index) != lock_index) {
            return;
          }
          // Still not where it was sent, and not moving: the command didn't take.
          auto result = evaluate_lock_verification(selected_lock_state(lock_index), expected_state, success_feedback);
          id(set_lock_feedback).execute(result.feedback.empty() ? failure_feedback : result.feedback);

  - id: verify_selected_cover_result
    mode: restart
    parameters:
      cover_index: int
      expected_state: std::string
      success_feedback: std::string
      pending_feedback: std::string
      failure_feedback: std::string
    then:
      - lambda: |-
          id(cover_verification_complete) = false;
      # Up to 20 s: garage doors and long shades take a while to travel.
      - repeat:
          count: 20
          then:
            - if:
                condition:
                  lambda: 'return !id(cover_verification_complete);'
                then:
                  - delay: 1000ms
                  - lambda: |-
                      if (id(current_mode) != REMOTE_MODE_COVERS || id(selected_cover_index) != cover_index) {
                        id(cover_verification_complete) = true;
                        return;
                      }
                      auto result = evaluate_cover_verification(selected_cover_state(cover_index),
                                                                selected_cover_position(cover_index),
                                                                expected_state, success_feedback);
                      // Nothing reported yet: keep saying the command is on its way.
                      id(set_cover_feedback).execute(result.feedback.empty() ? pending_feedback : result.feedback);
                      id(cover_verification_complete) = result.complete;
      - lambda: |-
          if (id(cover_verification_complete)) {
            return;
          }
          id(cover_verification_complete) = true;
          if (id(current_mode) != REMOTE_MODE_COVERS || id(selected_cover_index) != cover_index) {
            return;
          }
          // Not there, not moving, not stopped part-way: the command didn't take.
          auto result = evaluate_cover_verification(selected_cover_state(cover_index), selected_cover_position(cover_index),
                                                    expected_state, success_feedback);
          id(set_cover_feedback).execute(result.feedback.empty() ? failure_feedback : result.feedback);

  - id: verify_selected_alarm_result
    mode: restart
    parameters:
      alarm_index: int
      expected_state: std::string
      success_feedback: std::string
      failure_feedback: std::string
    then:
      - lambda: |-
          id(alarm_verification_complete) = false;
      - delay: ${ALARM_STATUS_UPDATE_DELAY_MS}ms
      - repeat:
          count: 6
          then:
            - if:
                condition:
                  lambda: 'return !id(alarm_verification_complete);'
                then:
                  - delay: 1000ms
                  - lambda: |-
                      if (id(current_mode) != REMOTE_MODE_ALARMS || id(selected_alarm_index) != alarm_index) {
                        id(alarm_verification_complete) = true;
                        return;
                      }
                      auto result = evaluate_alarm_verification(
                          alarm_state_for_index(alarm_index), expected_state, success_feedback, failure_feedback,
                          false);
                      if (!result.feedback.empty()) {
                        id(set_alarm_feedback).execute(result.feedback);
                      }
                      id(alarm_verification_complete) = result.complete;
      - if:
          condition:
            lambda: 'return !id(alarm_verification_complete);'
          then:
            - delay: 500ms
            - lambda: |-
                id(alarm_verification_complete) = true;
                if (id(current_mode) != REMOTE_MODE_ALARMS || id(selected_alarm_index) != alarm_index) {
                  return;
                }
                auto result = evaluate_alarm_verification(
                    alarm_state_for_index(alarm_index), expected_state, success_feedback, failure_feedback, true);
                if (!result.feedback.empty()) {
                  id(set_alarm_feedback).execute(result.feedback);
                }

  # The footer's arm-mode picker highlights the new choice, so this only
  # redraws; a feedback toast would cover the picker being adjusted.
  - id: shift_selected_alarm_arm_mode
    parameters:
      step: int
    then:
      - lambda: |-
          AlarmArmMode next_mode = next_alarm_arm_mode(clamp_alarm_arm_mode(id(selected_alarm_arm_mode)), step);
          id(selected_alarm_arm_mode) = static_cast<int>(next_mode);
          id(selected_setting_detail) = std::string(alarm_arm_mode_selection_label(next_mode));
          id(updated_ui) = true;
      - script.execute: update_display

  - id: set_alarm_blocked_feedback
    then:
      - script.execute:
          id: set_alarm_feedback
          feedback: !lambda |-
            if (ha_state_missing(id(selected_item_state))) {
              return std::string(id(selected_item_state) == "unavailable" ? "UNAVAILABLE" : "SYNCING");
            }
            return std::string("ALREADY ARMED");

  - id: start_alarm_transition
    parameters:
      feedback: std::string
      next_state: std::string
    then:
      - lambda: |-
          id(selected_item_state) = next_state;
          id(updated_ui) = true;
      - script.execute:
          id: set_alarm_feedback
          feedback: !lambda 'return feedback;'

  - id: execute_selected_alarm_action
    parameters:
      alarm_index: int
      action_name: std::string
      expected_state: std::string
      success_feedback: std::string
      failure_feedback: std::string
    then:
      # Home Assistant only answers a rejected request, never a panel that fails
      # on its own, so the panel's state is checked from now on.
      - script.execute:
          id: verify_selected_alarm_result
          alarm_index: !lambda 'return alarm_index;'
          expected_state: !lambda 'return expected_state;'
          success_feedback: !lambda 'return success_feedback;'
          failure_feedback: !lambda 'return failure_feedback;'
      - if:
          condition:
            lambda: 'return !std::string("${ALARM_CODE}").empty();'
          then:
            - homeassistant.action:
                action: !lambda 'return action_name;'
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  code: "${ALARM_CODE}"
                on_error:
                  - script.stop: verify_selected_alarm_result
                  - script.execute:
                      id: set_alarm_feedback
                      feedback: !lambda 'return failure_feedback;'
          else:
            - homeassistant.action:
                action: !lambda 'return action_name;'
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                on_error:
                  - script.stop: verify_selected_alarm_result
                  - script.execute:
                      id: set_alarm_feedback
                      feedback: !lambda 'return failure_feedback;'

  - id: arm_selected_alarm_mode
    mode: queued
    parameters:
      action_name: std::string
      expected_state: std::string
    then:
      - script.execute:
          id: start_alarm_transition
          feedback: "ARMING..."
          next_state: "arming"
      - script.execute:
          id: execute_selected_alarm_action
          alarm_index: !lambda 'return id(selected_alarm_index);'
          action_name: !lambda 'return action_name;'
          expected_state: !lambda 'return expected_state;'
          success_feedback: "SUCCESS"
          failure_feedback: "FAILED"

  - id: arm_selected_alarm_with_selected_mode
    then:
      - lambda: |-
          AlarmArmMode arm_mode = clamp_alarm_arm_mode(id(selected_alarm_arm_mode));
          const std::string &state = id(selected_item_state);
          std::string expected_armed = alarm_expected_armed_state(arm_mode);
          std::string action_name;
          switch (arm_mode) {
            case ALARM_ARM_MODE_HOME: action_name = "alarm_control_panel.alarm_arm_home"; break;
            case ALARM_ARM_MODE_NIGHT: action_name = "alarm_control_panel.alarm_arm_night"; break;
            case ALARM_ARM_MODE_VACATION: action_name = "alarm_control_panel.alarm_arm_vacation"; break;
            case ALARM_ARM_MODE_AWAY:
            default: action_name = "alarm_control_panel.alarm_arm_away"; break;
          }
          if (ha_state_missing(state) || state == expected_armed) {
            id(set_alarm_blocked_feedback).execute();
            return;
          }
          id(arm_selected_alarm_mode).execute(action_name, expected_armed);

  - id: disarm_selected_alarm
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return ha_state_missing(id(selected_item_state));'
          then:
            - script.execute:
                id: set_alarm_feedback
                feedback: !lambda 'return std::string(id(selected_item_state) == "unavailable" ? "UNAVAILABLE" : "SYNCING");'
            - script.stop: disarm_selected_alarm
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "disarmed";'
          then:
            - script.execute:
                id: set_alarm_feedback
                feedback: "ALREADY DISARMED"
            - script.stop: disarm_selected_alarm
      - script.execute:
          id: start_alarm_transition
          feedback: "DISARMING..."
          next_state: "disarming"
      - script.execute:
          id: execute_selected_alarm_action
          alarm_index: !lambda 'return id(selected_alarm_index);'
          action_name: "alarm_control_panel.alarm_disarm"
          expected_state: "disarmed"
          success_feedback: "SUCCESS"
          failure_feedback: "FAILED"

  - id: trigger_selected_alarm
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return ha_state_missing(id(selected_item_state));'
          then:
            - script.execute:
                id: set_alarm_feedback
                feedback: !lambda 'return std::string(id(selected_item_state) == "unavailable" ? "UNAVAILABLE" : "SYNCING");'
            - script.stop: trigger_selected_alarm
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "triggered";'
          then:
            - script.execute:
                id: set_alarm_feedback
                feedback: "ALREADY TRIGGERED"
            - script.stop: trigger_selected_alarm
      - script.execute:
          id: start_alarm_transition
          feedback: "TRIGGERING..."
          next_state: !lambda 'return id(selected_item_state);'
      - script.execute:
          id: execute_selected_alarm_action
          alarm_index: !lambda 'return id(selected_alarm_index);'
          action_name: "alarm_control_panel.alarm_trigger"
          expected_state: "triggered"
          success_feedback: "SUCCESS"
          failure_feedback: "FAILED"

  - id: open_selected_cover
    mode: queued
    parameters:
      cover_index: int
    then:
      - script.execute:
          id: set_cover_feedback
          feedback: "OPENING..."
      - lambda: |-
          if (id(selected_cover_position_pct) <= 0) {
            id(selected_cover_position_pct) = 100;
          }
          id(updated_ui) = true;
      # As with locks, the cover's state is checked from now on: Home Assistant
      # never answers for a device that fails on its own.
      - homeassistant.action:
          action: cover.open_cover
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
          on_error:
            - script.stop: verify_selected_cover_result
            - script.execute:
                id: set_cover_feedback
                feedback: "OPEN FAILED"
      - script.execute:
          id: verify_selected_cover_result
          cover_index: !lambda 'return cover_index;'
          expected_state: "open"
          success_feedback: "OPENED"
          pending_feedback: "OPENING..."
          failure_feedback: "OPEN FAILED"

  - id: close_selected_cover
    mode: queued
    parameters:
      cover_index: int
    then:
      - script.execute:
          id: set_cover_feedback
          feedback: "CLOSING..."
      # As with locks, the cover's state is checked from now on: Home Assistant
      # never answers for a device that fails on its own.
      - homeassistant.action:
          action: cover.close_cover
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
          on_error:
            - script.stop: verify_selected_cover_result
            - script.execute:
                id: set_cover_feedback
                feedback: "CLOSE FAILED"
      - script.execute:
          id: verify_selected_cover_result
          cover_index: !lambda 'return cover_index;'
          expected_state: "closed"
          success_feedback: "CLOSED"
          pending_feedback: "CLOSING..."
          failure_feedback: "CLOSE FAILED"

  - id: increase_cover_position
    mode: queued
    then:
      - lambda: |-
          int next = id(selected_cover_position_pct) + 10;
          if (next > 100) next = 100;
          if (next < 10) next = 10;
          id(selected_cover_position_pct) = next;
          id(selected_item_state) = next >= 100 ? "open" : "opening";
          id(last_cover_position_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            position: !lambda 'return id(selected_cover_position_pct);'
      - script.execute: update_display

  - id: decrease_cover_position
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_cover_position_pct) <= 10;'
          then:
            - homeassistant.service:
                service: cover.close_cover
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_cover_position_pct) = 0;
                id(selected_item_state) = "closed";
                id(last_cover_position_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            - lambda: |-
                int next = id(selected_cover_position_pct) - 10;
                if (next < 1) next = 1;
                id(selected_cover_position_pct) = next;
                id(selected_item_state) = "closing";
                id(last_cover_position_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: cover.set_cover_position
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  position: !lambda 'return id(selected_cover_position_pct);'
            - script.execute: update_display

  - id: increase_cover_tilt
    mode: queued
    then:
      - lambda: |-
          float current = cover_tilt_sent_recently(millis(), id(selected_cover_index))
                              ? id(pending_cover_tilt_pct)
                              : selected_cover_tilt(id(selected_cover_index));
          if (isnan(current)) {
            current = 0.0f;
          }
          int next = int(current + 10.0f);
          if (next > 100) next = 100;
          id(pending_cover_tilt_pct) = next;
          note_cover_tilt_sent(id(selected_cover_index));
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TILT %d%%", next);
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_tilt_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            tilt_position: !lambda 'return id(pending_cover_tilt_pct);'
      - script.execute: update_display

  - id: decrease_cover_tilt
    mode: queued
    then:
      - lambda: |-
          float current = cover_tilt_sent_recently(millis(), id(selected_cover_index))
                              ? id(pending_cover_tilt_pct)
                              : selected_cover_tilt(id(selected_cover_index));
          if (isnan(current)) {
            current = 100.0f;
          }
          int next = int(current - 10.0f);
          if (next < 0) next = 0;
          id(pending_cover_tilt_pct) = next;
          note_cover_tilt_sent(id(selected_cover_index));
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TILT %d%%", next);
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: cover.set_cover_tilt_position
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            tilt_position: !lambda 'return id(pending_cover_tilt_pct);'
      - script.execute: update_display
