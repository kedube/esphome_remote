# Runtime, feedback, and transient UI globals.
globals:
  - id: contrast
    type: int
    initial_value: '5'

  - id: last_active
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_brightness_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_switch_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_contrast_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_setting_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_climate_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_fan_speed_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_humidifier_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_humidifier_mode_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_lock_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_cover_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_cover_position_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_climate_target_focus_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_media_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_media_volume_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_media_source_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_media_power_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_automation_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_alarm_interaction
    type: uint32_t
    initial_value: '0'

  - id: last_notification_dismiss_interaction
    type: uint32_t
    initial_value: '0'

  # Short status message ("ALREADY ON") the footer shows for a few seconds.
  - id: ui_toast_text
    type: std::string
    restore_value: no
    initial_value: ''

  - id: ui_toast_at
    type: uint32_t
    initial_value: '0'

  # Set while a full-screen system page (powering off, rebooting) owns the
  # display, so a queued UI redraw cannot paint over it.
  - id: system_screen_active
    type: bool
    initial_value: 'false'

  - id: lock_verification_complete
    type: bool
    initial_value: 'false'

  - id: cover_verification_complete
    type: bool
    initial_value: 'false'

  - id: alarm_verification_complete
    type: bool
    initial_value: 'false'

  # When the alarm request being checked went out.
  - id: alarm_verification_started_at
    type: uint32_t
    initial_value: '0'

  # The automation's last_triggered before automation.trigger went out, and
  # when that was (seconds since 1970; 0 when the clock wasn't set).
  - id: automation_last_triggered_before
    type: std::string
    initial_value: '""'

  - id: automation_trigger_requested_at
    type: uint32_t
    initial_value: '0'

  # adjust_climate_temperature changed a setpoint and has it to send.
  - id: climate_adjust_pending
    type: bool
    initial_value: 'false'

  - id: updated_ui
    type: bool
    initial_value: 'true'

  - id: show_boot_screen
    type: bool
    initial_value: 'true'

  - id: low_battery_popup_active
    type: bool
    initial_value: 'false'

  - id: low_battery_popup_shown
    type: bool
    initial_value: 'false'

  - id: battery_monitoring_available
    type: bool
    initial_value: 'false'

  - id: battery_percentage
    type: int
    initial_value: '0'

  - id: battery_voltage
    type: float
    initial_value: 'NAN'

  - id: last_battery_update
    type: uint32_t
    initial_value: '0'

  - id: primary_button_press_started_at
    type: uint32_t
    initial_value: '0'

  - id: play_pause_button_press_started_at
    type: uint32_t
    initial_value: '0'

  - id: settings_button_press_started_at
    type: uint32_t
    initial_value: '0'

  - id: wake_button_press_started_at
    type: uint32_t
    initial_value: '0'

  - id: primary_button_press_mode
    type: int
    initial_value: '-1'

  - id: play_pause_button_press_mode
    type: int
    initial_value: '-1'

  - id: settings_button_press_mode
    type: int
    initial_value: '-1'

  - id: primary_button_long_press_fired
    type: bool
    initial_value: 'false'

  - id: play_pause_button_long_press_fired
    type: bool
    initial_value: 'false'

  - id: settings_button_long_press_fired
    type: bool
    initial_value: 'false'

  - id: wake_button_long_press_fired
    type: bool
    initial_value: 'false'

  - id: selected_setting_option
    type: int
    initial_value: '0'

  # The setting the user last picked with Settings. selected_setting_option
  # falls back to an item's first setting while this one isn't offered (a value
  # that hasn't synced yet, or a different kind of item) and returns to it once
  # it is. This is what is saved across sleep.
  - id: preferred_setting_option
    type: int
    initial_value: '0'

  - id: selected_weather_detail_index
    type: int
    initial_value: '0'

  - id: last_navigation_requested_at
    type: uint32_t
    initial_value: '0'
