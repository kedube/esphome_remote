script:
  - id: handle_wake_button_press
    then:
      - lambda: |-
          id(wake_button_press_started_at) = millis();
          id(wake_button_long_press_fired) = false;
      - script.execute: show_hold_to_reboot_screen

  - id: handle_wake_button_release
    then:
      - if:
          condition:
            lambda: 'return id(wake_button_press_started_at) == 0;'
          then:
            - script.stop: handle_wake_button_release
      - if:
          condition:
            lambda: 'return id(wake_button_long_press_fired);'
          then:
            - lambda: |-
                id(wake_button_press_started_at) = 0;
                id(wake_button_long_press_fired) = false;
            - script.stop: handle_wake_button_release
      # The hold bar is full at EXTENDED_HOLD_DURATION_MS, but the reboot check
      # only runs on the 500 ms runtime tick: a release after the bar filled
      # still reboots instead of powering off.
      - if:
          condition:
            lambda: 'return millis() - id(wake_button_press_started_at) >= ${EXTENDED_HOLD_DURATION_MS};'
          then:
            - lambda: |-
                id(wake_button_long_press_fired) = true;
                id(wake_button_press_started_at) = 0;
            - script.execute: reboot_device
            - script.stop: handle_wake_button_release
      - lambda: |-
          id(wake_button_press_started_at) = 0;
          id(wake_button_long_press_fired) = false;
      # Already powering off (the sleep timer got there first): nothing to do.
      - if:
          condition:
            not:
              script.is_running: turn_off
          then:
            - script.execute: turn_off

  # The footer's hold bar shows the prompt while the button is down. Square and
  # circle also leave it as feedback, so a too-short tap explains itself; the
  # settings button does not, because a tap there cycles settings.
  - id: show_sensitive_action_prompt
    parameters:
      action: int
    then:
      - lambda: |-
          if (action == 1) {
            return;
          }
          auto prompt = describe_remote_button_prompt(
              static_cast<RemoteMode>(id(current_mode)), action, id(selected_item_state), id(selected_alarm_arm_mode),
              ${LONG_PRESS_DURATION_MS}, ${EXTENDED_HOLD_DURATION_MS},
              selected_entity_traits(static_cast<RemoteMode>(id(current_mode)), id(selected_alarm_index),
                                     id(selected_cover_index), id(selected_automation_index),
                                     id(selected_setting_option)));
          switch (prompt.feedback_target) {
            case REMOTE_INPUT_FEEDBACK_LOCK:
              id(set_lock_feedback).execute(prompt.feedback);
              break;
            case REMOTE_INPUT_FEEDBACK_COVER:
              id(set_cover_feedback).execute(prompt.feedback);
              break;
            case REMOTE_INPUT_FEEDBACK_AUTOMATION:
              id(set_automation_feedback).execute(prompt.feedback);
              break;
            case REMOTE_INPUT_FEEDBACK_ALARM:
              id(set_alarm_feedback).execute(prompt.feedback);
              break;
            case REMOTE_INPUT_FEEDBACK_NONE:
            default:
              break;
          }
      - script.execute: animate_hold_progress

  - id: await_primary_long_press
    mode: restart
    then:
      - delay: ${LONG_PRESS_DURATION_MS}ms
      - lambda: |-
          bool same_mode = id(primary_button_press_mode) == id(current_mode);
          bool still_pressed = id(primary_mode_button).state;
          bool already_fired = id(primary_button_long_press_fired);

          if (id(primary_button_press_started_at) == 0 || !same_mode || !still_pressed || already_fired) {
            return;
          }

          id(primary_button_long_press_fired) = true;
          id(primary_mode_action).execute();

  - id: await_play_pause_long_press
    mode: restart
    then:
      - delay: ${LONG_PRESS_DURATION_MS}ms
      - lambda: |-
          bool same_mode = id(play_pause_button_press_mode) == id(current_mode);
          bool still_pressed = id(play_pause_mode_button).state;
          bool already_fired = id(play_pause_button_long_press_fired);

          if (id(play_pause_button_press_started_at) == 0 || !same_mode || !still_pressed || already_fired) {
            return;
          }

          id(play_pause_button_long_press_fired) = true;
          id(play_pause_mode_action).execute();

  - id: await_settings_long_press
    mode: restart
    then:
      - delay: ${EXTENDED_HOLD_DURATION_MS}ms
      - lambda: |-
          bool same_mode = id(settings_button_press_mode) == id(current_mode);
          bool still_pressed = id(settings_mode_button).state;
          bool already_fired = id(settings_button_long_press_fired);

          if (id(settings_button_press_started_at) == 0 || !same_mode || !still_pressed || already_fired) {
            return;
          }

          id(settings_button_long_press_fired) = true;
          id(secondary_mode_long_press_action).execute();

  - id: handle_primary_button_press
    then:
      - lambda: |-
          auto prompt = describe_remote_button_prompt(
              static_cast<RemoteMode>(id(current_mode)), 0, id(selected_item_state), id(selected_alarm_arm_mode),
              ${LONG_PRESS_DURATION_MS}, ${EXTENDED_HOLD_DURATION_MS},
              selected_entity_traits(static_cast<RemoteMode>(id(current_mode)), id(selected_alarm_index),
                                     id(selected_cover_index), id(selected_automation_index),
                                     id(selected_setting_option)));
          if (!prompt.requires_long_press) {
            id(primary_button_press_started_at) = 0;
            id(primary_button_press_mode) = -1;
            id(primary_button_long_press_fired) = false;
            id(primary_mode_action).execute();
            return;
          }

          id(primary_button_press_started_at) = millis();
          id(primary_button_press_mode) = id(current_mode);
          id(primary_button_long_press_fired) = false;
      # The lambda's early return only exits the lambda, so gate the prompt and
      # the hold timer on the press actually waiting for a long press.
      - if:
          condition:
            lambda: 'return id(primary_button_press_started_at) != 0;'
          then:
            - script.execute:
                id: show_sensitive_action_prompt
                action: 0
            - script.execute: await_primary_long_press

  - id: handle_primary_button_release
    then:
      - lambda: |-
          if (id(primary_button_press_started_at) == 0) {
            return;
          }

          bool long_press_fired = id(primary_button_long_press_fired);
          id(primary_button_press_started_at) = 0;
          id(primary_button_press_mode) = -1;
          id(primary_button_long_press_fired) = false;

          if (!long_press_fired) {
            id(updated_ui) = true;
            id(update_display).execute();
          }

  - id: handle_play_pause_button_press
    then:
      - lambda: |-
          auto prompt = describe_remote_button_prompt(
              static_cast<RemoteMode>(id(current_mode)), 2, id(selected_item_state), id(selected_alarm_arm_mode),
              ${LONG_PRESS_DURATION_MS}, ${EXTENDED_HOLD_DURATION_MS},
              selected_entity_traits(static_cast<RemoteMode>(id(current_mode)), id(selected_alarm_index),
                                     id(selected_cover_index), id(selected_automation_index),
                                     id(selected_setting_option)));
          if (!prompt.requires_long_press) {
            id(play_pause_button_press_started_at) = 0;
            id(play_pause_button_press_mode) = -1;
            id(play_pause_button_long_press_fired) = false;
            id(play_pause_mode_action).execute();
            return;
          }

          id(play_pause_button_press_started_at) = millis();
          id(play_pause_button_press_mode) = id(current_mode);
          id(play_pause_button_long_press_fired) = false;
      # The lambda's early return only exits the lambda, so gate the prompt and
      # the hold timer on the press actually waiting for a long press.
      - if:
          condition:
            lambda: 'return id(play_pause_button_press_started_at) != 0;'
          then:
            - script.execute:
                id: show_sensitive_action_prompt
                action: 2
            - script.execute: await_play_pause_long_press

  - id: handle_play_pause_button_release
    then:
      - lambda: |-
          if (id(play_pause_button_press_started_at) == 0) {
            return;
          }

          bool long_press_fired = id(play_pause_button_long_press_fired);
          id(play_pause_button_press_started_at) = 0;
          id(play_pause_button_press_mode) = -1;
          id(play_pause_button_long_press_fired) = false;

          if (!long_press_fired) {
            id(updated_ui) = true;
            id(update_display).execute();
          }

  - id: handle_settings_button_press
    then:
      - lambda: |-
          auto prompt = describe_remote_button_prompt(
              static_cast<RemoteMode>(id(current_mode)), 1, id(selected_item_state), id(selected_alarm_arm_mode),
              ${LONG_PRESS_DURATION_MS}, ${EXTENDED_HOLD_DURATION_MS},
              selected_entity_traits(static_cast<RemoteMode>(id(current_mode)), id(selected_alarm_index),
                                     id(selected_cover_index), id(selected_automation_index),
                                     id(selected_setting_option)));
          if (!prompt.requires_long_press) {
            id(settings_button_press_started_at) = 0;
            id(settings_button_press_mode) = -1;
            id(settings_button_long_press_fired) = false;
            id(secondary_mode_action).execute();
            return;
          }

          id(settings_button_press_started_at) = millis();
          id(settings_button_press_mode) = id(current_mode);
          id(settings_button_long_press_fired) = false;
      # The lambda's early return only exits the lambda, so gate the prompt and
      # the hold timer on the press actually waiting for a long press.
      - if:
          condition:
            lambda: 'return id(settings_button_press_started_at) != 0;'
          then:
            - script.execute:
                id: show_sensitive_action_prompt
                action: 1
            - script.execute: await_settings_long_press

  - id: handle_settings_button_release
    then:
      - lambda: |-
          if (id(settings_button_press_started_at) == 0) {
            return;
          }

          bool long_press_fired = id(settings_button_long_press_fired);
          int pressed_mode = id(settings_button_press_mode);
          id(settings_button_press_started_at) = 0;
          id(settings_button_press_mode) = -1;
          id(settings_button_long_press_fired) = false;

          if (!long_press_fired) {
            // Released before the trigger hold completed: fall back to the
            // normal short-press behaviour so cycling settings still works in
            // modes that arm a long press.
            if (pressed_mode == id(current_mode)) {
              id(secondary_mode_action).execute();
              return;
            }
            id(updated_ui) = true;
            id(update_display).execute();
          }

  # A held Previous, Next, Minus or Plus repeats its step, after REPEAT_DELAY_MS
  # and then every REPEAT_INTERVAL_MS (REPEAT_NAVIGATION_INTERVAL_MS through a
  # list). Previous and Next stop at the ends of the list rather than wrapping
  # round. Minus and Plus repeat on settings with a range (see
  # remote_setting_repeats) and on the weather details; while they do,
  # send_setting_value holds each value back, so Home Assistant only gets the
  # one the hold ends on. Lists and toggles step once per press. On a TV
  # remote's NAVIGATE all four are its arrows, and each repeat is sent.
  - id: button_repeat
    mode: restart
    parameters:
      button: int
    then:
      - lambda: |-
          remote_repeat_active = false;
          remote_repeat_button = button;
          remote_repeat_setting = id(selected_setting_option);
          remote_repeat_entity = id(selected_item_entity);
      - delay: !lambda 'return REPEAT_DELAY_MS;'
      - while:
          condition:
            lambda: |-
              bool held = button == REMOTE_REPEAT_PREVIOUS ? id(previous_button).state
                          : button == REMOTE_REPEAT_NEXT   ? id(next_button).state
                          : button == REMOTE_REPEAT_MINUS  ? id(minus_button).state
                                                           : id(plus_button).state;
              if (!held || remote_repeat_button != button) {
                return false;
              }
              bool arrows = remote_repeat_setting == REMOTE_SETTING_REMOTE_NAVIGATE;
              if ((button == REMOTE_REPEAT_PREVIOUS || button == REMOTE_REPEAT_NEXT || id(current_mode) == REMOTE_MODE_WEATHER) &&
                  !arrows) {
                return true;
              }
              if (id(selected_setting_option) != remote_repeat_setting || id(selected_item_entity) != remote_repeat_entity) {
                return false;
              }
              const std::string &state = id(selected_item_state);
              if (!remote_setting_repeats(id(selected_setting_option)) || state.empty() || state == "unavailable") {
                return false;
              }
              // Until Home Assistant has reported a level, a step asks it to
              // step from the real one, which isn't worth repeating.
              switch (id(selected_setting_option)) {
                case REMOTE_SETTING_LIGHT_DIMMER:
                  return state == "on" && id(selected_brightness_pct) > 0;
                case REMOTE_SETTING_FAN_SPEED:
                  return state == "on" && id(selected_fan_speed_pct) > 0;
                case REMOTE_SETTING_MEDIA_VOLUME:
                  return id(selected_media_volume_pct) >= 0;
                default:
                  return true;
              }
          then:
            - script.execute: reset_idle_timer
            - if:
                condition:
                  lambda: 'return button == REMOTE_REPEAT_PREVIOUS || button == REMOTE_REPEAT_NEXT;'
                then:
                  - if:
                      condition:
                        lambda: 'return id(selected_setting_option) == REMOTE_SETTING_REMOTE_NAVIGATE;'
                      then:
                        - script.execute:
                            id: remote_nav_key
                            key: !lambda 'return button == REMOTE_REPEAT_NEXT ? REMOTE_KEY_RIGHT : REMOTE_KEY_LEFT;'
                      else:
                        - script.execute:
                            id: shift_selected_item
                            step: !lambda 'return button == REMOTE_REPEAT_NEXT ? 1 : -1;'
                            wrap: false
                  - delay: !lambda 'return REPEAT_NAVIGATION_INTERVAL_MS;'
                else:
                  - lambda: 'remote_repeat_active = true;'
                  - if:
                      condition:
                        lambda: 'return button == REMOTE_REPEAT_PLUS;'
                      then:
                        - script.execute: increase_mode_value
                      else:
                        - script.execute: decrease_mode_value
                  - delay: !lambda 'return REPEAT_INTERVAL_MS;'
      - lambda: 'remote_repeat_active = false;'

  # Released: the repeat ends, and a value it held back goes out.
  - id: end_button_repeat
    parameters:
      button: int
    then:
      - if:
          condition:
            lambda: 'return remote_repeat_button == button;'
          then:
            - script.stop: button_repeat
            - lambda: |-
                remote_repeat_active = false;
                remote_repeat_button = -1;
