script:
  - id: update_selected_item
    mode: restart
    then:
      - lambda: |-
          if (!remote_ui_bindings_bound) {
            return;
          }
          auto selection_refs = make_mode_selection_state_refs(
              id(selected_light_index), id(selected_switch_index), id(selected_climate_index),
              id(selected_water_heater_index), id(selected_lock_index),
              id(selected_cover_index), id(selected_media_index), id(selected_automation_index), id(selected_weather_index),
              id(selected_fan_index), id(selected_humidifier_index), id(selected_sensor_index), id(selected_alarm_index),
              id(selected_notification_index), id(selected_info_index), id(selected_input_index),
              id(selected_vacuum_index), id(selected_timer_index), id(selected_remote_index));
            auto selection = resolve_current_ui_selection_context(id(current_mode), id(current_menu_index), selection_refs);

          if (selection.count <= 0) {
            id(selected_item_name) = "NO ITEMS";
            id(selected_item_entity) = "";
            id(selected_item_state) = "";
            id(updated_ui) = true;
            return;
          }

          const char *item_name = ui_selection_item_name_cstr(selection);
          const char *item_entity = ui_selection_item_entity_cstr(selection);
          if (item_name != nullptr) {
            id(selected_item_name) = item_name;
          } else {
            id(selected_item_name) = ui_selection_item_name(selection);
          }
          if (item_entity != nullptr) {
            id(selected_item_entity) = item_entity;
          } else {
            id(selected_item_entity) = ui_selection_item_entity(selection);
          }
          const RemoteUiBindings &bindings = remote_ui_bindings;
          RemoteUiResetState state = make_remote_ui_reset_state(bindings);
          reset_remote_ui_state(state);
          // Not carried in RemoteUiResetState, so clear it here; otherwise the
          // previous item's "TRIGGERED..." stays on screen for the next one.
          id(last_automation_feedback).clear();
          id(last_automation_interaction) = 0;
          id(ui_toast_at) = 0;

          if (selection.mode == REMOTE_MODE_MEDIA) {
            const std::string &state = selected_media_state(selection.resolved_index);
            const std::string &device_class = media_device_class_for_index(selection.resolved_index);
            const std::string &title = media_title_for_index(selection.resolved_index);
            const std::string &artist = media_artist_for_index(selection.resolved_index);
            const std::string &source = media_source_for_index(selection.resolved_index);
            float volume = selected_media_volume(selection.resolved_index);

            id(selected_item_state) = state;
            id(selected_media_device_class) = device_class;
            id(selected_media_title) = title;
            id(selected_media_artist) = artist;
            if ((device_class == "tv" || device_class == "receiver")) {
              if (!source.empty()) {
                id(selected_media_source) = source;
              }
            } else {
              id(selected_media_source) = source;
            }
            if (!isnan(volume)) {
              int pct = (int) roundf(volume * 100.0f);
              if (pct < 0) pct = 0;
              if (pct > 100) pct = 100;
              id(selected_media_volume_pct) = pct;
            } else {
              // Unknown: never step from the previous player's level.
              id(selected_media_volume_pct) = -1;
            }
          }
      - script.execute: persist_ui_state
      - script.execute: sync_current_mode_status
      - script.execute:
          id: cycle_setting_option
          step: 0
          quiet: false

  # Today's high, low and precipitation for a weather entity. Home Assistant
  # dropped the forecast attribute from weather entities in 2024.3, so ask
  # weather.get_forecasts, and have Home Assistant shrink the reply to those
  # three numbers before sending it. The daily forecast's entry for today
  # (an integration can still list yesterday); an integration without daily
  # forecasts (the US National Weather Service) is asked for twice-daily ones,
  # whose next day and night periods give the high and the low. Takes only the
  # entity's index, like every script whose action waits for an answer (see
  # lock_selected_lock).
  - id: fetch_weather_forecast
    mode: queued
    parameters:
      weather_index: int
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: !lambda 'return std::string(weather_entity_id_for_index(weather_index));'
            type: !lambda 'return std::string(weather_forecast_type_for_index(weather_index));'
          capture_response: true
          response_template: >-
            {%- set ns = namespace(high=none, low=none, precipitation=none, day=false, night=false) -%}
            {%- set today = now().date() -%}
            {%- for data in response.values() -%}
            {%- for entry in data.get('forecast', []) -%}
            {%- set date = as_local(as_datetime(entry.get('datetime'))).date() -%}
            {%- if 'is_daytime' in entry -%}
            {%- if date >= today and entry.get('is_daytime') and not ns.day -%}
            {%- set ns.high = entry.get('temperature') -%}
            {%- set ns.day = true -%}
            {%- elif date >= today and not entry.get('is_daytime') and not ns.night -%}
            {%- set ns.low = entry.get('templow') if entry.get('templow') is not none else entry.get('temperature') -%}
            {%- set ns.night = true -%}
            {%- endif -%}
            {%- elif date == today and not ns.day -%}
            {%- set ns.high = entry.get('temperature') -%}
            {%- set ns.low = entry.get('templow') -%}
            {%- set ns.precipitation = entry.get('precipitation') -%}
            {%- set ns.day = true -%}
            {%- endif -%}
            {%- endfor -%}
            {%- endfor -%}
            {{ {'high': ns.high, 'low': ns.low, 'precipitation': ns.precipitation} }}
          on_success:
            - lambda: |-
                store_weather_forecast(weather_index, response);
                id(updated_ui) = true;
          on_error:
            - lambda: 'weather_forecast_failed(weather_index);'

  - id: sync_current_mode_status
    mode: restart
    then:
      - lambda: |-
          // A command the remote just sent is still in flight: keep showing the
          // expected result instead of Home Assistant's not-yet-updated value.
          if (!remote_ui_bindings_bound || local_change_hold_active(millis())) {
            return;
          }
          auto selection_refs = make_mode_selection_state_refs(
              id(selected_light_index), id(selected_switch_index), id(selected_climate_index),
              id(selected_water_heater_index), id(selected_lock_index),
              id(selected_cover_index), id(selected_media_index), id(selected_automation_index), id(selected_weather_index),
              id(selected_fan_index), id(selected_humidifier_index), id(selected_sensor_index), id(selected_alarm_index),
              id(selected_notification_index), id(selected_info_index), id(selected_input_index),
              id(selected_vacuum_index), id(selected_timer_index), id(selected_remote_index));
            auto selection = resolve_current_ui_selection_context(id(current_mode), id(current_menu_index), selection_refs);
          const RemoteUiBindings &bindings = remote_ui_bindings;
          RemoteUiSyncState ui = make_remote_ui_sync_state(bindings);

          bool redraw_pending = id(updated_ui);
          id(updated_ui) = false;
          sync_remote_ui_state(selection.mode, selection.resolved_index, ui);
          bool synced = id(updated_ui);
          id(updated_ui) = redraw_pending || synced;
          // Which settings the item offers follows what Home Assistant has sent:
          // most of it arrives after a wake, a light only has a brightness while
          // it is on, and an attribute such as a light's effect list can arrive
          // without anything on screen changing. Quiet: only a setting that
          // changes is redrawn.
          id(cycle_setting_option).execute(0, true);
          // Today's forecast, once per wake for each weather entity. Only once
          // Home Assistant is connected: it drops requests sent before, and a
          // request it never answered is sent again.
          if (selection.mode == REMOTE_MODE_WEATHER && weather_forecast_due(selection.resolved_index, millis()) &&
              esphome::api::global_api_server != nullptr &&
              esphome::api::global_api_server->is_connected_with_state_subscription()) {
            mark_weather_forecast_sent(selection.resolved_index, millis());
            id(fetch_weather_forecast).execute(selection.resolved_index);
          }
          if (static_cast<RemoteSettingOption>(id(selected_setting_option)) == REMOTE_SETTING_LIGHT_DIMMER
              && id(selected_item_state) == "on" && id(selected_brightness_pct) > 0) {
            char buf[16];
            snprintf(buf, sizeof(buf), "%d%%", id(selected_brightness_pct));
            if (id(selected_setting_detail) != buf) {
              id(selected_setting_detail) = buf;
              id(updated_ui) = true;
            }
          }
          if (static_cast<RemoteSettingOption>(id(selected_setting_option)) == REMOTE_SETTING_FAN_SPEED
              && id(selected_fan_speed_pct) > 0) {
            char buf[24];
            snprintf(buf, sizeof(buf), "%d%%", id(selected_fan_speed_pct));
            if (id(selected_setting_detail) != buf) {
              id(selected_setting_detail) = buf;
              id(updated_ui) = true;
            }
          }
          if (static_cast<RemoteSettingOption>(id(selected_setting_option)) == REMOTE_SETTING_COVER_POSITION) {
            char buf[16];
            buf[0] = '\0';
            if (id(selected_cover_position_pct) > 0) {
              snprintf(buf, sizeof(buf), "%d%%", id(selected_cover_position_pct));
            }
            if (id(selected_setting_detail) != buf) {
              id(selected_setting_detail) = buf;
              id(updated_ui) = true;
            }
          }
          if (selection.mode == REMOTE_MODE_WEATHER) {
            auto opt = static_cast<RemoteSettingOption>(id(selected_setting_option));
            char buf[32];
            buf[0] = '\0';
            switch (opt) {
              case REMOTE_SETTING_WEATHER_HUMIDITY:
                if (!isnan(id(selected_weather_humidity))) {
                  snprintf(buf, sizeof(buf), "%.0f%%", id(selected_weather_humidity));
                }
                break;
              case REMOTE_SETTING_WEATHER_WIND_SPEED:
                if (!isnan(id(selected_weather_wind_speed))) {
                  snprintf(buf, sizeof(buf), "%.1f", id(selected_weather_wind_speed));
                }
                break;
              case REMOTE_SETTING_WEATHER_WIND_BEARING:
                if (!isnan(id(selected_weather_wind_bearing))) {
                  snprintf(buf, sizeof(buf), "%.0f°", id(selected_weather_wind_bearing));
                }
                break;
              case REMOTE_SETTING_WEATHER_WIND_GUST:
                if (!isnan(id(selected_weather_wind_gust_speed))) {
                  snprintf(buf, sizeof(buf), "%.1f", id(selected_weather_wind_gust_speed));
                }
                break;
              case REMOTE_SETTING_WEATHER_PRESSURE:
                if (!isnan(id(selected_weather_pressure))) {
                  snprintf(buf, sizeof(buf), "%.2f", id(selected_weather_pressure));
                }
                break;
              case REMOTE_SETTING_WEATHER_PRECIPITATION:
                if (!isnan(id(selected_weather_precipitation))) {
                  snprintf(buf, sizeof(buf), "%.2f", id(selected_weather_precipitation));
                }
                break;
              case REMOTE_SETTING_WEATHER_CLOUD_COVERAGE:
                if (!isnan(id(selected_weather_cloud_coverage))) {
                  snprintf(buf, sizeof(buf), "%.0f%%", id(selected_weather_cloud_coverage));
                }
                break;
              case REMOTE_SETTING_WEATHER_UV_INDEX:
                if (!isnan(id(selected_weather_uv_index))) {
                  snprintf(buf, sizeof(buf), "%.1f", id(selected_weather_uv_index));
                }
                break;
              case REMOTE_SETTING_WEATHER_DEW_POINT:
                if (!isnan(id(selected_weather_dew_point))) {
                  snprintf(buf, sizeof(buf), "%.0f°%s", id(selected_weather_dew_point), "${TEMPERATURE_UNIT}");
                }
                break;
              case REMOTE_SETTING_WEATHER_APPARENT_TEMP:
                if (!isnan(id(selected_weather_apparent_temperature))) {
                  snprintf(buf, sizeof(buf), "%.0f°%s", id(selected_weather_apparent_temperature), "${TEMPERATURE_UNIT}");
                }
                break;
              case REMOTE_SETTING_WEATHER_HIGH_TEMP:
                if (!isnan(id(selected_weather_high_temp))) {
                  snprintf(buf, sizeof(buf), "%.0f°%s", id(selected_weather_high_temp), "${TEMPERATURE_UNIT}");
                }
                break;
              case REMOTE_SETTING_WEATHER_LOW_TEMP:
                if (!isnan(id(selected_weather_low_temp))) {
                  snprintf(buf, sizeof(buf), "%.0f°%s", id(selected_weather_low_temp), "${TEMPERATURE_UNIT}");
                }
                break;
              default:
                break;
            }
            if (buf[0] != '\0' && id(selected_setting_detail) != buf) {
              id(selected_setting_detail) = buf;
              id(updated_ui) = true;
            }
          }
          if (selection.mode == REMOTE_MODE_MEDIA) {
            auto opt = static_cast<RemoteSettingOption>(id(selected_setting_option));
            if (opt == REMOTE_SETTING_MEDIA_SELECT || opt == REMOTE_SETTING_MEDIA_CHANNEL) {
              const std::string &next_detail = id(selected_media_artist);
              if (id(selected_setting_detail) != next_detail) {
                id(selected_setting_detail) = next_detail;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_MEDIA_VOLUME) {
              char buf[24];
              buf[0] = '\0';
              if (id(selected_media_volume_pct) >= 0) {
                snprintf(buf, sizeof(buf), "%d%%", id(selected_media_volume_pct));
              }
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_MEDIA_REPEAT) {
              char buf[32];
              str_upper_to_buffer(id(selected_media_repeat), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_MEDIA_STATE) {
              char buf[32];
              str_upper_to_buffer(id(selected_item_state), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
          }
          if (selection.mode == REMOTE_MODE_CLIMATE) {
            auto opt = static_cast<RemoteSettingOption>(id(selected_setting_option));
            if (opt == REMOTE_SETTING_CLIMATE_LOW || opt == REMOTE_SETTING_CLIMATE_HIGH ||
                opt == REMOTE_SETTING_CLIMATE_TARGET) {
              float low = id(selected_climate_target_temp_low);
              float high = id(selected_climate_target_temp_high);
              float single = opt == REMOTE_SETTING_CLIMATE_LOW ? low :
                             opt == REMOTE_SETTING_CLIMATE_HIGH ? high : id(selected_climate_target_temp);
              bool dual = opt != REMOTE_SETTING_CLIMATE_TARGET && !isnan(low) && !isnan(high);
              char buf[48];
              buf[0] = '\0';
              if (dual || !isnan(single)) {
                format_climate_target_detail(buf, sizeof(buf), dual, low, high, single, "${TEMPERATURE_UNIT}");
              }
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_CLIMATE_FAN) {
              char buf[32];
              str_upper_to_buffer(id(selected_climate_fan_mode), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_CLIMATE_HUMIDITY) {
              char buf[24];
              buf[0] = '\0';
              if (!isnan(id(selected_climate_target_humidity))) {
                snprintf(buf, sizeof(buf), "TARGET: %.0f%%", id(selected_climate_target_humidity));
              }
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_CLIMATE_PRESETS) {
              const std::string &next_detail = id(selected_climate_preset);
              if (id(selected_setting_detail) != next_detail) {
                id(selected_setting_detail) = next_detail;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_CLIMATE_ACTION) {
              char buf[32];
              str_upper_to_buffer(id(selected_climate_hvac_action), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_CLIMATE_STATE) {
              char buf[32];
              str_upper_to_buffer(id(selected_item_state), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
          }
          if (selection.mode == REMOTE_MODE_HUMIDIFIERS) {
            auto opt = static_cast<RemoteSettingOption>(id(selected_setting_option));
            if (opt == REMOTE_SETTING_HUMIDIFIER_HUMIDITY) {
              char buf[24];
              buf[0] = '\0';
              if (!isnan(id(selected_humidifier_target_humidity))) {
                snprintf(buf, sizeof(buf), "TARGET: %.0f%%", id(selected_humidifier_target_humidity));
              }
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_HUMIDIFIER_MODE) {
              char buf[32];
              str_upper_to_buffer(id(selected_humidifier_mode), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_HUMIDIFIER_ACTION) {
              const std::string &next_detail = id(selected_humidifier_action);
              if (id(selected_setting_detail) != next_detail) {
                id(selected_setting_detail) = next_detail;
                id(updated_ui) = true;
              }
            }
            if (opt == REMOTE_SETTING_HUMIDIFIER_STATE) {
              char buf[32];
              str_upper_to_buffer(id(selected_item_state), buf, sizeof(buf));
              if (id(selected_setting_detail) != buf) {
                id(selected_setting_detail) = buf;
                id(updated_ui) = true;
              }
            }
          }
          if (selection.mode == REMOTE_MODE_ALARMS) {
            auto opt = static_cast<RemoteSettingOption>(id(selected_setting_option));
            if (opt == REMOTE_SETTING_ALARM_STATE) {
              const char *next_detail = alarm_arm_mode_selection_label(alarm_effective_arm_mode(
                  id(selected_alarm_arm_mode), alarm_supported_features_for_index(selection.resolved_index)));
              if (id(selected_setting_detail) != next_detail) {
                id(selected_setting_detail) = next_detail;
                id(updated_ui) = true;
              }
            }
          }
