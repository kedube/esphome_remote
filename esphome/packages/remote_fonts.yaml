# Fonts used by the renderer (src/remote_ui_renderer.cpp). Every icon the
# renderer draws must be listed under hero_icons.
font:
  # The text fonts carry printable ASCII, Latin-1 (accented letters, ² ³ µ °)
  # and typographic quotes, dashes, • € and …, so Home Assistant names, units
  # and notifications draw without boxes for missing characters.
  - file: "../assets/fonts/arial-bold.ttf"
    id: tiny_font
    size: 9
    glyphs: &text_glyphs [' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ‘’“”–—•€…']
  - file: "../assets/fonts/arial-bold.ttf"
    id: small_font
    size: 10
    glyphs: *text_glyphs
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 700
    id: title_font
    size: 14
    glyphs: *text_glyphs
  - file:
      type: gfonts
      family: Roboto Condensed
      weight: 700
    id: large_font
    size: 28
    glyphs: ['0123456789°%.-: ONF']
  - file:
      type: gfonts
      family: Material+Symbols+Rounded
      weight: 400
    id: hero_icons
    size: 24
    glyphs: [
      "\ue90f", # lightbulb
      "\uf8c7", # power_settings_new
