# Fonts used by the renderer (src/remote_ui_renderer.cpp). The text fonts and
# their sizes are settings (the *_FONT substitutions in settings.yaml). The icon
# font isn't: the renderer draws Material Symbols codepoints, and every icon it
# draws must be listed under hero_icons.
font:
  # The text fonts carry printable ASCII, Latin-1 (accented letters, ² ³ µ °)
  # and typographic quotes, dashes, • € and …, so Home Assistant names, units
  # and notifications draw without boxes for missing characters.
  # Header, chips and footer labels.
  - file: "${LABEL_FONT}"
    id: tiny_font
    size: ${LABEL_FONT_SIZE}
    glyphs: &text_glyphs [' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~¡¢£¤¥¦§¨©ª«¬®¯°±²³´µ¶·¸¹º»¼½¾¿ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖ×ØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõö÷øùúûüýþÿ‘’“”–—•€…']
  # Media titles, notifications, units and the weather high/low.
  - file: "${TEXT_FONT}"
    id: small_font
    size: ${TEXT_FONT_SIZE}
    glyphs: *text_glyphs
  # Entity names. Names too wide for name_font use name_small_font, then
  # small_font.
  - file: "${NAME_FONT}"
    id: name_font
    size: ${NAME_FONT_SIZE}
    glyphs: *text_glyphs
  - file: "${NAME_FONT}"
    id: name_small_font
    size: ${NAME_FONT_SMALL_SIZE}
    glyphs: *text_glyphs
  # State words such as UNLOCKED, setpoints, Info lines and headlines.
  - file: "${STATE_FONT}"
    id: title_font
    size: ${STATE_FONT_SIZE}
    glyphs: *text_glyphs
  # Large values. Anything this font can't draw falls back to title_font.
  - file: "${VALUE_FONT}"
    id: large_font
    size: ${VALUE_FONT_SIZE}
    glyphs: ['0123456789°%.-: ONF']
  - file:
      type: gfonts
      family: Material+Symbols+Rounded
      weight: 400
    id: hero_icons
    size: 24
    glyphs: [
