substitutions:
  PIN_BTN_DIMMER: "32"
  PIN_BTN_CIRCLE: "5"

esphome:
  # Deep sleep forced by run_duration calls begin_sleep() directly and skips
  # turn_off, which would leave the OLED lit through sleep. Blank it here too;
  # after a normal turn_off this is a no-op.
  on_shutdown:
    then:
      - script.execute: clear_display_for_sleep

script:
  - id: turn_off
    mode: single
    then:
      - script.execute: persist_ui_state_and_sync
      - script.execute: show_powering_off_screen
      - delay: 1s
      - script.execute: clear_display_for_sleep
      - delay: 500ms
      - deep_sleep.enter: go_sleep
