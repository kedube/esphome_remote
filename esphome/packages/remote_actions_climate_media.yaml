script:
  # Circle on a thermostat that is off. Restores that thermostat's own last
  # active mode, falling back to a mode it reports supporting.
  - id: turn_on_selected_climate
    then:
      - lambda: |-
          std::string mode = climate_turn_on_mode_for_index(id(selected_climate_index));
          if (mode.empty()) {
            id(show_toast).execute("SYNCING");
            return;
          }
          id(set_selected_climate_hvac_mode).execute(mode, "TURNING ON");

  # Square. A thermostat without an "off" mode can't be switched off.
  - id: turn_off_selected_climate
    then:
      - if:
          condition:
            lambda: 'return climate_supports_off(id(selected_climate_index));'
          then:
            - script.execute:
                id: set_selected_climate_hvac_mode
                mode_name: "off"
                preview: "TURNING OFF"
          else:
            - script.execute:
                id: show_toast
                text: "NO OFF MODE"

  - id: set_selected_climate_hvac_mode
    parameters:
      mode_name: std::string
      preview: std::string
    mode: queued
    then:
      # A MODE still waiting to go out would undo this one.
      - lambda: |-
          if (remote_pending_option.kind == OPTION_SEND_HVAC_MODE &&
              remote_pending_option.entity == id(selected_item_entity)) {
            remote_pending_option.kind = -1;
          }
          id(selected_item_state) = mode_name;
          id(last_climate_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            hvac_mode: !lambda 'return mode_name;'
      - script.execute:
          id: show_toast
          text: !lambda 'return preview;'

  - id: adjust_climate_temperature
    parameters:
      target_focus: int
      delta: float
    mode: queued
    then:
      - lambda: |-
          bool dual_target = remote_ui_has_dual_climate_target(
              id(selected_item_state), id(selected_climate_target_temp_low), id(selected_climate_target_temp_high));
          bool high_focus = dual_target && target_focus == 2;
          float next = dual_target
                           ? (high_focus ? id(selected_climate_target_temp_high) : id(selected_climate_target_temp_low))
                           : id(selected_climate_target_temp);

          id(climate_adjust_pending) = false;
          if (isnan(next)) {
            return;
          }

          // Home Assistant rejects a setpoint outside the thermostat's
          // min_temp/max_temp, and a LOW at or above HIGH: at a limit the
          // setpoint stays where it is and nothing is sent.
          const float before = next;
          next = clamp_climate_temperature(id(selected_climate_index), next + delta);
          if (dual_target) {
            float low = id(selected_climate_target_temp_low);
            float high = id(selected_climate_target_temp_high);
            if (high_focus ? (!isnan(low) && next <= low) : (!isnan(high) && next >= high)) {
              next = before;
            }
          }
          if (next == before) {
            return;
          }
          id(climate_adjust_pending) = true;

          if (dual_target) {
            if (high_focus) {
              id(selected_climate_target_temp_high) = next;
            } else {
              id(selected_climate_target_temp_low) = next;
            }
            id(climate_target_focus_value) = next;
            id(climate_target_focus) = target_focus;
          } else {
            // Leave low/high alone: a single-setpoint unit in heat_cool would
            // otherwise look dual-target below and be sent a range it rejects.
            id(selected_climate_target_temp) = next;
            id(climate_target_focus_value) = next;
            id(climate_target_focus) = 1;
          }

          id(last_climate_target_focus_interaction) = millis();
          id(last_climate_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - if:
          condition:
            lambda: |-
              return id(climate_adjust_pending) &&
                     remote_ui_has_dual_climate_target(id(selected_item_state), id(selected_climate_target_temp_low),
                                                       id(selected_climate_target_temp_high));
          then:
            - script.execute:
                id: send_setting_value
                kind: !lambda 'return VALUE_SEND_CLIMATE_RANGE;'
                entity: !lambda 'return id(selected_item_entity);'
                value: !lambda 'return id(selected_climate_target_temp_low);'
                value2: !lambda 'return id(selected_climate_target_temp_high);'
          else:
            # The lambda's early return doesn't stop this script: skip the call
            # when there is no target to send (not synced yet, or the
            # thermostat is off and reports none).
            - if:
                condition:
                  lambda: 'return id(climate_adjust_pending) && !isnan(id(selected_climate_target_temp));'
                then:
                  - script.execute:
                      id: send_setting_value
                      kind: !lambda 'return VALUE_SEND_CLIMATE_TARGET;'
                      entity: !lambda 'return id(selected_item_entity);'
                      value: !lambda 'return id(selected_climate_target_temp);'
                      value2: !lambda 'return NAN;'
      - script.execute: update_display

  - id: climate_temperature_up
    mode: queued
    then:
      - script.execute:
          id: adjust_climate_temperature
          target_focus: 1
          delta: 1.0

  - id: climate_temperature_down
    mode: queued
    then:
      - script.execute:
          id: adjust_climate_temperature
          target_focus: 1
          delta: -1.0

  - id: climate_temperature_high_up
    mode: queued
    then:
      - script.execute:
          id: adjust_climate_temperature
          target_focus: 2
          delta: 1.0

  - id: climate_temperature_high_down
    mode: queued
    then:
      - script.execute:
          id: adjust_climate_temperature
          target_focus: 2
          delta: -1.0

  - id: cycle_selected_climate_preset_step
    parameters:
      step: int
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return climate_supports_preset(id(selected_climate_index));'
          then:
            - lambda: |-
                std::string next = step_delimited_option(
                    selected_climate_preset_modes(id(selected_climate_index)), id(selected_climate_preset), step);
                if (next.empty()) {
                  id(updated_ui) = true;
                  return;
                }
                id(selected_climate_preset) = next;
                id(last_climate_interaction) = millis();
                id(last_setting_interaction) = millis();
                id(selected_setting_detail) = next;
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: climate.set_preset_mode
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  preset_mode: !lambda 'return id(selected_climate_preset);'
            - script.execute: update_display

  - id: set_selected_climate_fan_mode
    parameters:
      mode_name: std::string
    mode: queued
    then:
      - lambda: |-
          if (mode_name.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_climate_fan_mode) = mode_name;
          id(last_climate_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = mode_name;
          note_local_change();
          id(updated_ui) = true;
      - if:
          condition:
            lambda: 'return !mode_name.empty();'
          then:
            - homeassistant.action:
                action: climate.set_fan_mode
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  fan_mode: !lambda 'return mode_name;'
            - script.execute: update_display

  - id: adjust_selected_climate_humidity
    parameters:
      delta: float
    mode: queued
    then:
      - lambda: |-
          float next = id(selected_climate_target_humidity);
          if (isnan(next)) {
            next = 50.0f;
          }
          // Home Assistant rejects a target outside the thermostat's limits.
          next = clamp_climate_humidity(id(selected_climate_index), next + delta);
          id(selected_climate_target_humidity) = next;
          id(last_climate_interaction) = millis();
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TARGET: %.0f%%", next);
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - script.execute:
          id: send_setting_value
          kind: !lambda 'return VALUE_SEND_CLIMATE_HUMIDITY;'
          entity: !lambda 'return id(selected_item_entity);'
          value: !lambda 'return id(selected_climate_target_humidity);'
          value2: !lambda 'return NAN;'
      - script.execute: update_display

  - id: media_set_shuffle
    parameters:
      enabled: bool
    mode: queued
    then:
      - lambda: |-
          id(selected_media_shuffle) = enabled ? "on" : "off";
          id(last_media_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = enabled ? "SHUFFLE ON" : "SHUFFLE OFF";
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: media_player.shuffle_set
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            shuffle: !lambda 'return enabled;'
      - script.execute: update_display

  - id: cycle_selected_media_repeat
    parameters:
      step: int
    mode: queued
    then:
      - lambda: |-
          const std::string options = "off|all|one";
          std::string next = step > 0
              ? next_delimited_option(options, id(selected_media_repeat))
              : previous_delimited_option(options, id(selected_media_repeat));
          if (next.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_media_repeat) = next;
          id(last_media_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = next;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: media_player.repeat_set
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            repeat: !lambda 'return id(selected_media_repeat);'
      - script.execute: update_display

  - id: cycle_selected_media_sound_mode
    parameters:
      step: int
    mode: queued
    then:
      - lambda: |-
          std::string next = step_delimited_option(
              selected_media_sound_mode_list(id(selected_media_index)), id(selected_media_sound_mode), step);
          if (next.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_media_sound_mode) = next;
          id(last_media_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = next;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: media_player.select_sound_mode
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            sound_mode: !lambda 'return id(selected_media_sound_mode);'
      - script.execute: update_display

  # Circle on a heater that is off. water_heater.turn_on only works on a heater
  # with the on/off feature; any other is turned on by going back to its last
  # operation (or the first one it lists other than "off").
  - id: water_heater_turn_on_selected
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return water_heater_supports_on_off(id(selected_water_heater_index));'
          then:
            - homeassistant.service:
                service: water_heater.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "on";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            - lambda: |-
                std::string operation = water_heater_turn_on_operation(id(selected_water_heater_index));
                if (operation.empty()) {
                  id(show_toast).execute("NO ON MODE");
                  return;
                }
                id(selected_item_state) = operation;
                id(set_water_heater_operation_mode).execute(operation);

  # Square. Without the on/off feature a heater is switched off through its
  # "off" operation, if it has one.
  - id: water_heater_turn_off_selected
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return water_heater_supports_on_off(id(selected_water_heater_index));'
          then:
            - homeassistant.service:
                service: water_heater.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "off";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            - lambda: |-
                if (!water_heater_has_operation(id(selected_water_heater_index), "off")) {
                  id(show_toast).execute("NO OFF MODE");
                  return;
                }
                id(selected_item_state) = "off";
                id(set_water_heater_operation_mode).execute("off");

  - id: adjust_water_heater_target
    parameters:
      delta: float
    mode: queued
    then:
      - lambda: |-
          // Home Assistant passes water heater setpoints to the device without a
          // range check, so keep to the heater's own min_temp/max_temp. Until
          // those sync, fall back to a typical tank's range.
          const bool celsius = std::string("${TEMPERATURE_UNIT}") == "C";
          float min_target = selected_water_heater_min_temperature(id(selected_water_heater_index));
          float max_target = selected_water_heater_max_temperature(id(selected_water_heater_index));
          if (isnan(min_target) || isnan(max_target) || min_target >= max_target) {
            min_target = celsius ? 30.0f : 90.0f;
            max_target = celsius ? 60.0f : 140.0f;
          }
          float next = id(selected_water_heater_target_temp);
          if (isnan(next)) {
            next = celsius ? 49.0f : 120.0f;
          }
          next += delta;
          if (next < min_target) {
            next = min_target;
          } else if (next > max_target) {
            next = max_target;
          }
          id(selected_water_heater_target_temp) = next;
          id(last_setting_interaction) = millis();
          char buffer[24];
          snprintf(buffer, sizeof(buffer), "TARGET %.0f°%s", next, "${TEMPERATURE_UNIT}");
          id(selected_setting_detail) = buffer;
          note_local_change();
          id(updated_ui) = true;
      - script.execute:
          id: send_setting_value
          kind: !lambda 'return VALUE_SEND_WATER_HEATER_TARGET;'
          entity: !lambda 'return id(selected_item_entity);'
          value: !lambda 'return id(selected_water_heater_target_temp);'
          value2: !lambda 'return NAN;'
      - script.execute: update_display

  - id: set_water_heater_operation_mode
    parameters:
      mode_name: std::string
    mode: queued
    then:
      - lambda: |-
          if (mode_name.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_water_heater_mode) = mode_name;
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = mode_name;
          note_local_change();
          id(updated_ui) = true;
      - if:
          condition:
            lambda: 'return !mode_name.empty();'
          then:
            - homeassistant.service:
                service: water_heater.set_operation_mode
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  operation_mode: !lambda 'return mode_name;'
            - script.execute: update_display

  - id: set_water_heater_away_mode
    parameters:
      enabled: bool
    mode: queued
    then:
      - lambda: |-
          id(selected_water_heater_away) = enabled ? "on" : "off";
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = enabled ? "AWAY ON" : "AWAY OFF";
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: water_heater.set_away_mode
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            away_mode: !lambda 'return enabled;'
      - script.execute: update_display

  - id: media_play_pause
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "playing";'
          then:
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "paused";
          else:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "paused";'
                then:
                  - homeassistant.action:
                      action: media_player.media_play
                      data:
                        entity_id: !lambda 'return id(selected_item_entity);'
                  - lambda: |-
                      id(selected_item_state) = "playing";
                else:
                  - homeassistant.action:
                      action: media_player.media_play_pause
                      data:
                        entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(last_media_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  # Circle: a player that is off or in standby is turned on; any other plays
  # or pauses.
  - id: media_circle_action
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "off" || id(selected_item_state) == "standby";'
          then:
            - script.execute: media_turn_on
          else:
            - script.execute: media_play_pause

  # Square: a TV or receiver is turned off, since they seldom support stop;
  # any other player stops.
  - id: media_square_action
    then:
      - if:
          condition:
            lambda: |-
              return id(selected_media_device_class) == "tv" || id(selected_media_device_class) == "receiver";
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "off" || id(selected_item_state) == "standby";'
                then:
                  - script.execute:
                      id: show_toast
                      text: "ALREADY OFF"
                else:
                  - script.execute: media_turn_off
          else:
            - script.execute: media_play_stop

  # A TV shows ON/OFF in large text; other players get a footer note.
  - id: media_turn_on
    mode: queued
    then:
      - homeassistant.action:
          action: media_player.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "on";
          bool show_power_feedback =
              id(selected_media_device_class) != "tv" && id(selected_media_device_class) != "receiver";
          id(last_media_power_feedback) = show_power_feedback ? "TURNING ON" : "";
          id(last_media_power_interaction) = show_power_feedback ? millis() : 0;
          id(last_media_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  - id: media_turn_off
    mode: queued
    then:
      - homeassistant.action:
          action: media_player.turn_off
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "off";
          id(last_media_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  - id: media_previous_track
    mode: queued
    then:
      - homeassistant.service:
          service: media_player.media_previous_track
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(updated_ui) = true;
      - script.execute: update_display

  - id: media_next_track
    mode: queued
    then:
      - homeassistant.service:
          service: media_player.media_next_track
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(updated_ui) = true;
      - script.execute: update_display

  - id: media_play_stop
    mode: queued
    then:
      - homeassistant.service:
          service: media_player.media_stop
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "idle";
          id(last_media_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  - id: adjust_media_volume
    parameters:
      delta: int
    mode: queued
    then:
      - if:
          # The player reports no volume (it is off, or hasn't synced): ask it to
          # step instead of setting a level guessed from nothing.
          condition:
            lambda: 'return id(selected_media_volume_pct) < 0;'
          then:
            - homeassistant.action:
                action: !lambda 'return delta > 0 ? "media_player.volume_up" : "media_player.volume_down";'
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
          else:
            - lambda: |-
                int next = id(selected_media_volume_pct) + delta;
                if (next > 100) next = 100;
                if (next < 0) next = 0;
                id(selected_media_volume_pct) = next;
                id(last_media_volume_interaction) = millis();
                id(last_media_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute:
                id: send_setting_value
                kind: !lambda 'return VALUE_SEND_MEDIA_VOLUME;'
                entity: !lambda 'return id(selected_item_entity);'
                value: !lambda 'return id(selected_media_volume_pct);'
                value2: !lambda 'return NAN;'
            - script.execute: update_display

  - id: media_volume_up
    mode: queued
    then:
      - script.execute:
          id: adjust_media_volume
          delta: 5

  - id: media_volume_down
    mode: queued
    then:
      - script.execute:
          id: adjust_media_volume
          delta: -5

  # MODE in the footer: the thermostat's HVAC modes. The screen shows the new
  # mode at once; it goes out once the presses stop (send_option_after_pause),
  # so stepping from heat past cool to auto never switches the system to cool.
  - id: step_climate_hvac_mode
    parameters:
      step: int
    then:
      - lambda: |-
          std::string next =
              step_delimited_option(selected_climate_hvac_modes(id(selected_climate_index)), id(selected_item_state), step);
          if (next.empty()) {
            return;
          }
          id(selected_item_state) = next;
          id(last_climate_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = esphome::str_upper_case(next);
          note_local_change();
          id(updated_ui) = true;
          id(send_option_after_pause).execute(OPTION_SEND_HVAC_MODE, id(selected_item_entity), next);
      - script.execute: update_display

  - id: media_set_mute
    parameters:
      enabled: bool
    mode: queued
    then:
      - lambda: |-
          id(last_media_interaction) = millis();
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = enabled ? "ON" : "OFF";
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: media_player.volume_mute
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            is_volume_muted: !lambda 'return enabled;'
      - script.execute: update_display
