script:
  # Polls the script that was started (by tracker index) until it finishes, and
  # stops quietly if the user selects a different item in the meantime.
  - id: verify_selected_script_result
    mode: restart
    parameters:
      automation_index: int
    then:
      - repeat:
          count: 8
          then:
            - delay: 1000ms
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) != REMOTE_MODE_AUTOMATION ||
                           id(selected_automation_index) != automation_index;
                then:
                  - script.stop: verify_selected_script_result
            - if:
                condition:
                  lambda: |-
                    const std::string &state = automation_state_for_index(automation_index);
                    return state == "off" || state == "idle";
                then:
                  - script.execute:
                      id: set_automation_feedback
                      feedback: "COMPLETED"
                  - script.stop: verify_selected_script_result

  # Home Assistant answers automation.trigger only once the whole run has
  # finished, which can be minutes away (even after the remote has slept and
  # woken, when the answer could be taken for another request's), so the
  # remote doesn't wait for that answer: the automation's last_triggered says
  # it ran. TRIGGERED once that is as recent as the press, NOT RUN if it isn't
  # after 5 s: a single-mode automation that is already running ignores the
  # request, and Home Assistant ignores every request when the remote may not
  # perform actions.
  - id: verify_selected_automation_trigger
    mode: restart
    parameters:
      automation_index: int
    then:
      - repeat:
          count: 10
          then:
            - delay: 500ms
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) != REMOTE_MODE_AUTOMATION ||
                           id(selected_automation_index) != automation_index ||
                           id(last_automation_feedback) != "TRIGGERING...";
                then:
                  - script.stop: verify_selected_automation_trigger
            - if:
                condition:
                  lambda: |-
                    return automation_ran_since(automation_index, id(automation_trigger_requested_at),
                                                id(automation_last_triggered_before));
                then:
                  - script.execute:
                      id: set_automation_feedback
                      feedback: "TRIGGERED"
                  - script.stop: verify_selected_automation_trigger
      - script.execute:
          id: set_automation_feedback
          feedback: "NOT RUN"

  # A scene or script request Home Assistant never answers (it doesn't when
  # the remote may not perform actions) shows NO RESPONSE after 10 s. Until
  # then ACTIVATING... or RUNNING... is kept on screen.
  - id: expire_automation_request
    mode: restart
    parameters:
      automation_index: int
      pending: std::string
    then:
      - repeat:
          count: 4
          then:
            - delay: 2500ms
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) != REMOTE_MODE_AUTOMATION ||
                           id(selected_automation_index) != automation_index || id(last_automation_feedback) != pending;
                then:
                  - script.stop: expire_automation_request
            - script.execute:
                id: set_automation_feedback
                feedback: !lambda 'return pending;'
      - if:
          condition:
            lambda: |-
              return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                     id(selected_automation_index) == automation_index && id(last_automation_feedback) == pending;
          then:
            - script.execute:
                id: set_automation_feedback
                feedback: "NO RESPONSE"

  # Takes only the item's index, like every script whose Home Assistant action
  # waits for an answer (see lock_selected_lock).
  - id: trigger_selected_automation
    mode: queued
    parameters:
      automation_index: int
    then:
      - if:
          condition:
            # A script in "single" mode ignores a start while it runs.
            lambda: |-
              return automation_kind(automation_index) == AUTOMATION_KIND_SCRIPT &&
                     automation_state_for_index(automation_index) == "on" && script_ignores_restart(automation_index);
          then:
            - script.execute:
                id: set_automation_feedback
                feedback: "ALREADY RUNNING"
            - script.stop: trigger_selected_automation
      - lambda: |-
          AutomationKind kind = automation_kind(automation_index);
          if (kind == AUTOMATION_KIND_SCRIPT) {
            id(set_automation_feedback).execute("RUNNING...");
          } else if (kind == AUTOMATION_KIND_SCENE) {
            id(set_automation_feedback).execute("ACTIVATING...");
          } else if (kind == AUTOMATION_KIND_BUTTON) {
            id(set_automation_feedback).execute("PRESSING...");
          } else {
            id(automation_last_triggered_before) = automation_last_triggered_for_index(automation_index);
            time_t now = ::time(nullptr);
            id(automation_trigger_requested_at) = now > 1600000000 ? static_cast<uint32_t>(now) : 0;
            id(set_automation_feedback).execute("TRIGGERING...");
          }
      - if:
          condition:
            lambda: 'return automation_kind(automation_index) == AUTOMATION_KIND_AUTOMATION;'
          then:
            - homeassistant.action:
                action: automation.trigger
                data:
                  entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_AUTOMATION, automation_index));'
            - script.execute:
                id: verify_selected_automation_trigger
                automation_index: !lambda 'return automation_index;'
          else:
            - if:
                condition:
                  lambda: 'return automation_kind(automation_index) == AUTOMATION_KIND_SCENE;'
                then:
                  - homeassistant.action:
                      action: scene.turn_on
                      data:
                        entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_AUTOMATION, automation_index));'
                      on_success:
                        - if:
                            condition:
                              lambda: |-
                                return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                                       id(selected_automation_index) == automation_index;
                            then:
                              - script.execute:
                                  id: set_automation_feedback
                                  feedback: "ACTIVATED"
                      on_error:
                        - if:
                            condition:
                              lambda: |-
                                return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                                       id(selected_automation_index) == automation_index;
                            then:
                              - script.execute:
                                  id: set_automation_feedback
                                  feedback: "FAILED"
                  - script.execute:
                      id: expire_automation_request
                      automation_index: !lambda 'return automation_index;'
                      pending: "ACTIVATING..."
                else:
                  - if:
                      condition:
                        lambda: 'return automation_kind(automation_index) == AUTOMATION_KIND_BUTTON;'
                      then:
                        - script.execute:
                            id: press_selected_button
                            automation_index: !lambda 'return automation_index;'
                        - script.stop: trigger_selected_automation
                  - homeassistant.action:
                      action: script.turn_on
                      data:
                        entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_AUTOMATION, automation_index));'
                      on_success:
                        - if:
                            condition:
                              lambda: |-
                                return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                                       id(selected_automation_index) == automation_index;
                            then:
                              - script.execute:
                                  id: set_automation_feedback
                                  feedback: "STARTED"
                              - script.execute:
                                  id: verify_selected_script_result
                                  automation_index: !lambda 'return automation_index;'
                      on_error:
                        - if:
                            condition:
                              lambda: |-
                                return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                                       id(selected_automation_index) == automation_index;
                            then:
                              - script.execute:
                                  id: set_automation_feedback
                                  feedback: "FAILED"
                  - script.execute:
                      id: expire_automation_request
                      automation_index: !lambda 'return automation_index;'
                      pending: "RUNNING..."

  # button.press, or input_button.press for a helper. Home Assistant answers
  # once the press has been passed on.
  - id: press_selected_button
    mode: queued
    parameters:
      automation_index: int
    then:
      - homeassistant.action:
          action: !lambda 'return entity_domain_action(mode_item_entity_cstr(REMOTE_MODE_AUTOMATION, automation_index), "press");'
          data:
            entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_AUTOMATION, automation_index));'
          on_success:
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                           id(selected_automation_index) == automation_index;
                then:
                  - script.execute:
                      id: set_automation_feedback
                      feedback: "PRESSED"
          on_error:
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) == REMOTE_MODE_AUTOMATION &&
                           id(selected_automation_index) == automation_index;
                then:
                  - script.execute:
                      id: set_automation_feedback
                      feedback: "FAILED"
      - script.execute:
          id: expire_automation_request
          automation_index: !lambda 'return automation_index;'
          pending: "PRESSING..."

  # VALUE in the footer of a number or input_number: its own step, within its
  # min and max, from the value just sent while Home Assistant hasn't reported
  # it yet. Held, it repeats, and only where it stops is sent.
  - id: adjust_input_number
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_input_index);
          uint32_t now = millis();
          float current = pending_value_or(now, REMOTE_MODE_INPUTS, idx, REMOTE_SETTING_INPUT_VALUE,
                                           input_value_for_index(idx));
          float next = number_step_value(current, input_min_for_index(idx), input_max_for_index(idx),
                                         input_step_for_index(idx), step);
          if (std::isfinite(current) && next == current) {
            return;  // at its min or max
          }
          note_pending_value(REMOTE_MODE_INPUTS, idx, REMOTE_SETTING_INPUT_VALUE, next);
          id(last_setting_interaction) = now;
          note_local_change();
          id(updated_ui) = true;
          id(send_setting_value).execute(VALUE_SEND_NUMBER, id(selected_item_entity), next, NAN);
      - script.execute: update_display

  # OPTION in the footer of a select or input_select. Picking an option can
  # set off automations, so it goes out once the presses stop
  # (send_option_after_pause), not for every option on the way.
  - id: step_input_select
    parameters:
      step: int
    then:
      - lambda: |-
          std::string next =
              step_delimited_option(input_options_for_index(id(selected_input_index)), id(selected_item_state), step);
          if (next.empty()) {
            return;
          }
          id(selected_item_state) = next;
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = next;
          note_local_change();
          id(updated_ui) = true;
          id(send_option_after_pause).execute(OPTION_SEND_SELECT, id(selected_item_entity), next);
      - script.execute: update_display

  # Timers. Circle starts one (or resumes it) or pauses it; Square cancels it.
  - id: timer_circle_action
    then:
      - lambda: |-
          const std::string &state = id(selected_item_state);
          if (state.empty()) {
            id(show_toast).execute("SYNCING");
            return;
          }
          bool active = state == "active";
          id(selected_item_state) = active ? "paused" : "active";
          note_local_change();
          id(updated_ui) = true;
          id(show_toast).execute(active ? "PAUSED" : "STARTED");
          id(call_entity_action).execute(active ? "timer.pause" : "timer.start", id(selected_item_entity),
                                         active ? "PAUSE FAILED" : "START FAILED");

  - id: timer_square_action
    then:
      - lambda: |-
          const std::string &state = id(selected_item_state);
          if (state.empty()) {
            id(show_toast).execute("SYNCING");
            return;
          }
          if (state == "idle") {
            id(show_toast).execute("NOT RUNNING");
            return;
          }
          id(selected_item_state) = "idle";
          note_local_change();
          id(updated_ui) = true;
          id(show_toast).execute("CANCELLED");
          id(call_entity_action).execute("timer.cancel", id(selected_item_entity), "CANCEL FAILED");
