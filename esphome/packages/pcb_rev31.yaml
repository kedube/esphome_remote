substitutions:
    PIN_BAT_ADC: "32"
    PIN_BTN_DIMMER: "5"
    PIN_BTN_CIRCLE: "17"
    PIN_OLED_EN: "15"

esphome:
  on_boot:
    # Deep sleep leaves GPIO pads latched. ESPHome's deep_sleep component calls
    # gpio_deep_sleep_hold_en() on the way into sleep (a GLOBAL latch covering
    # every hold-capable pad) and never releases it on wake. Because turn_off
    # drives PIN_OLED_EN low just before sleeping, the OLED enable pin stays
    # frozen low through boot: switch.turn_on below updates the GPIO register,
    # but the pad ignores it and the display never powers up.
    #
    # Release the latch before anything tries to drive a pin. Must out-prioritize
    # the oled_power turn_on beneath it.
    - priority: 900
      then:
        # See oled_hold_release.h. Must run before the oled_power GPIOSwitch
        # sets up (HARDWARE = 800) and before the turn_on at 700.
        - lambda: 'oled_release_deep_sleep_hold(${PIN_OLED_EN});'
    - priority: 700
      then:
        - switch.turn_on: oled_power
        # The SH1106 needs its VCC rail to rise and its internal charge pump to
        # stabilize before it will ACK on I2C. ssd1306_i2c::setup() probes the
        # panel exactly once and calls mark_failed() on no-ACK — a terminal
        # state with no retry for the rest of the boot — so losing this race
        # means a dead display until the next reboot. No reset_pin is wired, so
        # init_reset_() is a no-op and this delay is the panel's ONLY settle
        # time. 10ms was marginal; the margin shrinks as the battery drains.
        # The wait must block: an on_boot `delay:` only postpones the rest of
        # this automation, while setup carries straight on to the display.
        - lambda: 'delay(${OLED_POWER_ON_SETTLE_MS});'
    - priority: 400
      then:
        - script.execute: update_battery
  # Deep sleep forced by run_duration calls begin_sleep() directly and skips
  # turn_off, which would leave the OLED lit and its rail powered (the pin is
  # then held high) through sleep. Blank it and cut power here too, in that
  # order; after a normal turn_off both steps are no-ops.
  on_shutdown:
    then:
      # Forced sleep (run_duration), the hold-to-reboot and OTA restarts skip
      # turn_off, so save the UI state here too.
      - script.execute: persist_ui_state
      # Keeps favorite lists Home Assistant changed while the remote was awake.
      - lambda: 'favorites_save_pending();'
      - script.execute: clear_display_for_sleep
      - switch.turn_off: oled_power

switch:
  - platform: gpio
    id: oled_power
    pin: ${PIN_OLED_EN}
    internal: true
    restore_mode: ALWAYS_ON
    
sensor:
  - platform: adc
    pin: ${PIN_BAT_ADC}
    id: battery_adc
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: ${BATTERY_DIVIDER_MULTIPLIER}

  - platform: template
    id: battery_voltage_sensor
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      if (!id(battery_adc).has_state()) {
        return NAN;
      }
      return id(battery_adc).state;

  - platform: template
    id: battery_percent_sensor
    name: "Battery"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: never
    lambda: |-
      if (!id(battery_adc).has_state()) {
        return NAN;
      }

      float v = id(battery_adc).state;
      static float v_avg = 0;

      const float V_MIN = ${BATTERY_VOLTAGE_MIN};
      const float V_MAX = ${BATTERY_VOLTAGE_MAX};
      const float GAMMA = ${BATTERY_VOLTAGE_CURVE_GAMMA};

      if (isnan(v) || v < 2.5 || v > 4.5) {
        return NAN;
      }

      v_avg = (v_avg == 0) ? v : (v_avg * 0.8f + v * 0.2f);
      v = v_avg;

      if (v <= V_MIN) return 0;
      if (v >= V_MAX) return 100;

      float x = (v - V_MIN) / (V_MAX - V_MIN);
      float pct = powf(x, GAMMA) * 100.0f;

      return (int)roundf(pct);

script:
  - id: turn_off
    mode: single
    then:
      - script.execute: persist_ui_state_and_sync
      - script.execute: show_powering_off_screen
      - delay: 1s
      - script.execute: clear_display_for_sleep
      - delay: 500ms
      - switch.turn_off: oled_power
      - delay: 10ms
      - deep_sleep.enter: go_sleep

  - id: update_battery
    mode: single
    then:
      - logger.log:
          level: DEBUG
          format: "Updating battery state"
      - component.update: battery_adc
      - delay: 50ms
      - lambda: |-
          ESP_LOGD("battery", "ADC has state: %d value: %.3f",
            id(battery_adc).has_state(),
            id(battery_adc).has_state() ? id(battery_adc).state : -1.0);
      - component.update: battery_voltage_sensor
      - component.update: battery_percent_sensor
      - lambda: |-
          bool voltage_valid = id(battery_voltage_sensor).has_state() && !isnan(id(battery_voltage_sensor).state);
          bool percentage_valid = id(battery_percent_sensor).has_state() && !isnan(id(battery_percent_sensor).state);

          id(battery_monitoring_available) = voltage_valid && percentage_valid;
          id(battery_voltage) = voltage_valid ? id(battery_voltage_sensor).state : NAN;
          id(battery_percentage) = percentage_valid ? int(roundf(id(battery_percent_sensor).state)) : 0;
          id(last_battery_update) = millis();
          id(updated_ui) = true;

interval:
  - interval: 5min
    then:
      - script.execute: update_battery
