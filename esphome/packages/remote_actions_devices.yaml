script:
  # Circle: on at the light's last brightness. light.turn_on without a
  # brightness has Home Assistant restore that level; the screen shows ON until
  # it reports the level.
  - id: turn_on_selected_light
    mode: queued
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          if (id(selected_item_state) != "on") {
            id(selected_item_state) = "on";
            id(selected_brightness_pct) = 0;
          }
          note_local_change();
          id(updated_ui) = true;
      - script.execute: refresh_setting_options
      - script.execute: update_display

  - id: turn_off_selected_light
    mode: queued
    then:
      # A brightness held back by a repeating Plus would turn it on again.
      - script.stop: send_setting_value
      - homeassistant.action:
          action: light.turn_off
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      # The brightness goes too, so Plus in the next few seconds turns the
      # light on at 10% rather than stepping from its old level.
      - lambda: |-
          id(selected_item_state) = "off";
          id(selected_brightness_pct) = 0;
          note_local_change();
          id(updated_ui) = true;
      - script.execute: refresh_setting_options
      - script.execute: update_display

  # No speed: the fan comes back at its last speed. The screen shows ON until
  # Home Assistant reports that speed.
  - id: turn_on_selected_fan
    mode: queued
    then:
      - homeassistant.action:
          action: fan.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "on";
          id(selected_fan_speed_pct) = 0;
          note_local_change();
          id(updated_ui) = true;
      - script.execute: refresh_setting_options
      - script.execute: update_display

  - id: turn_off_selected_fan
    mode: queued
    then:
      # A speed held back by a repeating Minus would turn it on again.
      - script.stop: send_setting_value
      - homeassistant.action:
          action: fan.turn_off
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "off";
          id(selected_fan_speed_pct) = 0;
          note_local_change();
          id(updated_ui) = true;
      - script.execute: refresh_setting_options
      - script.execute: update_display

  - id: turn_on_selected_switch
    mode: queued
    parameters:
      switch_index: int
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "on";'
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "ALREADY ON"
            - lambda: 'id(updated_ui) = true;'
            - script.execute: update_display
          else:
            # Hold "turning_on" on screen until Home Assistant has caught up.
            - lambda: |-
                id(last_switch_feedback) = "";
                id(selected_item_state) = "turning_on";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
            # switch.turn_on, or input_boolean.turn_on for a helper.
            - homeassistant.action:
                action: !lambda 'return entity_domain_action(mode_item_entity_cstr(REMOTE_MODE_SWITCHES, switch_index), "turn_on");'
                data:
                  entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_SWITCHES, switch_index));'
                on_success:
                  - if:
                      condition:
                        lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index;'
                      then:
                        - script.execute:
                            id: set_switch_feedback
                            feedback: "SUCCESS"
                on_error:
                  - if:
                      condition:
                        lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index;'
                      then:
                        - script.stop: verify_selected_switch_result
                        - script.execute:
                            id: set_switch_feedback
                            feedback: "FAILED"
            - script.execute:
                id: verify_selected_switch_result
                switch_index: !lambda 'return switch_index;'
                expected_state: "on"

  - id: turn_off_selected_switch
    mode: queued
    parameters:
      switch_index: int
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "off";'
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "ALREADY OFF"
            - lambda: 'id(updated_ui) = true;'
            - script.execute: update_display
          else:
            # Hold "turning_off" on screen until Home Assistant has caught up.
            - lambda: |-
                id(last_switch_feedback) = "";
                id(selected_item_state) = "turning_off";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
            - homeassistant.action:
                action: !lambda 'return entity_domain_action(mode_item_entity_cstr(REMOTE_MODE_SWITCHES, switch_index), "turn_off");'
                data:
                  entity_id: !lambda 'return std::string(mode_item_entity_cstr(REMOTE_MODE_SWITCHES, switch_index));'
                on_success:
                  - if:
                      condition:
                        lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index;'
                      then:
                        - script.execute:
                            id: set_switch_feedback
                            feedback: "SUCCESS"
                on_error:
                  - if:
                      condition:
                        lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index;'
                      then:
                        - script.stop: verify_selected_switch_result
                        - script.execute:
                            id: set_switch_feedback
                            feedback: "FAILED"
            - script.execute:
                id: verify_selected_switch_result
                switch_index: !lambda 'return switch_index;'
                expected_state: "off"

  # Home Assistant never answers for a switch that fails on its own, so its
  # state is checked. TURNING ON/OFF gives way to the state as soon as Home
  # Assistant reports it; FAILED if that hasn't happened within 5 s.
  - id: verify_selected_switch_result
    mode: restart
    parameters:
      switch_index: int
      expected_state: std::string
    then:
      - repeat:
          count: 10
          then:
            - delay: 500ms
            - if:
                condition:
                  lambda: |-
                    return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index &&
                           selected_switch_state(switch_index) == expected_state;
                then:
                  - lambda: |-
                      clear_local_change();
                      id(selected_item_state) = expected_state;
                      id(updated_ui) = true;
                  - script.execute: update_display
                  - script.stop: verify_selected_switch_result
      - if:
          condition:
            lambda: |-
              return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index &&
                     selected_switch_state(switch_index) != expected_state;
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "FAILED"

  # Plus. A light that can't dim just turns on. Otherwise 10% steps from the
  # level on screen (an off light comes on at 10%); just after the light came
  # back on at a level Home Assistant hasn't reported yet, Home Assistant
  # steps from the real one.
  - id: increase_brightness
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return selected_light_dimmable(id(selected_light_index)) == 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "on";'
                then:
                  - script.execute: turn_on_selected_light
          else:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "on" && id(selected_brightness_pct) <= 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: !lambda 'return id(selected_item_entity);'
                        brightness_step_pct: "10"
                  - lambda: 'id(last_brightness_interaction) = millis();'
                else:
                  - lambda: |-
                      int next = id(selected_brightness_pct) + 10;
                      if (next > 100) next = 100;
                      if (next < 10) next = 10;
                      id(selected_brightness_pct) = next;
                      id(selected_item_state) = "on";
                      id(last_brightness_interaction) = millis();
                      note_local_change();
                      id(updated_ui) = true;
                  - script.execute:
                      id: send_setting_value
                      kind: !lambda 'return VALUE_SEND_LIGHT_BRIGHTNESS;'
                      entity: !lambda 'return id(selected_item_entity);'
                      value: !lambda 'return id(selected_brightness_pct);'
                      value2: !lambda 'return NAN;'
                  - script.execute: refresh_setting_options
                  - script.execute: update_display

  # Minus. Turns the light off at 10% or less; does nothing to a light that is
  # off. Steps from the real level, as Plus does, while it is unknown (Home
  # Assistant turns the light off when that step takes it to zero).
  - id: decrease_brightness
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) != "on";'
          then:
            - script.stop: decrease_brightness
      - if:
          condition:
            lambda: 'return id(selected_brightness_pct) <= 0;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  brightness_step_pct: "-10"
            - lambda: 'id(last_brightness_interaction) = millis();'
            - script.stop: decrease_brightness
      - if:
          condition:
            lambda: 'return id(selected_brightness_pct) <= 10;'
          then:
            - script.execute:
                id: send_setting_value
                kind: !lambda 'return VALUE_SEND_LIGHT_BRIGHTNESS;'
                entity: !lambda 'return id(selected_item_entity);'
                value: !lambda 'return 0;'
                value2: !lambda 'return NAN;'
            - lambda: |-
                id(selected_brightness_pct) = 0;
                id(selected_item_state) = "off";
                id(last_brightness_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute: refresh_setting_options
            - script.execute: update_display
          else:
            - lambda: |-
                int next = id(selected_brightness_pct) - 10;
                if (next < 1) next = 1;
                id(selected_brightness_pct) = next;
                id(selected_item_state) = "on";
                id(last_brightness_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute:
                id: send_setting_value
                kind: !lambda 'return VALUE_SEND_LIGHT_BRIGHTNESS;'
                entity: !lambda 'return id(selected_item_entity);'
                value: !lambda 'return id(selected_brightness_pct);'
                value2: !lambda 'return NAN;'
            - script.execute: update_display

  # Plus on a fan that is off turns it on at its last speed, as Circle does.
  # On a running fan it steps by the fan's own speed increment (33% on a
  # 3-speed fan) and sends that speed, so a second press within the few
  # seconds before Home Assistant reports back steps from what the screen
  # shows. Just after the fan came on at a speed Home Assistant hasn't
  # reported yet, Home Assistant steps from the real one.
  - id: increase_fan_speed
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) != "on";'
          then:
            - script.execute: turn_on_selected_fan
          else:
            - if:
                condition:
                  lambda: 'return selected_fan_supports_speed(id(selected_fan_index)) && id(selected_fan_speed_pct) <= 0;'
                then:
                  - homeassistant.action:
                      action: fan.increase_speed
                      data:
                        entity_id: !lambda 'return id(selected_item_entity);'
                  - lambda: 'id(last_fan_speed_interaction) = millis();'
                else:
                  - if:
                      condition:
                        lambda: 'return selected_fan_supports_speed(id(selected_fan_index));'
                      then:
                        - lambda: |-
                            id(selected_fan_speed_pct) = fan_step_percentage(
                                id(selected_fan_speed_pct), selected_fan_percentage_step(id(selected_fan_index)), 1);
                            id(last_fan_speed_interaction) = millis();
                            note_local_change();
                            id(updated_ui) = true;
                        - script.execute:
                            id: send_setting_value
                            kind: !lambda 'return VALUE_SEND_FAN_PERCENTAGE;'
                            entity: !lambda 'return id(selected_item_entity);'
                            value: !lambda 'return id(selected_fan_speed_pct);'
                            value2: !lambda 'return NAN;'
                        - script.execute: update_display

  # Minus on a running fan steps down by its own speed increment, and below
  # the lowest speed turns it off (Home Assistant does the same when it steps
  # from a speed it hasn't reported yet). While a fan is off only Plus applies.
  - id: decrease_fan_speed
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) != "on";'
          then:
            - script.stop: decrease_fan_speed
      - if:
          condition:
            lambda: 'return !selected_fan_supports_speed(id(selected_fan_index));'
          then:
            - script.execute: turn_off_selected_fan
            - script.stop: decrease_fan_speed
      - if:
          condition:
            lambda: 'return id(selected_fan_speed_pct) <= 0;'
          then:
            - homeassistant.action:
                action: fan.decrease_speed
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: 'id(last_fan_speed_interaction) = millis();'
            - script.stop: decrease_fan_speed
      - if:
          condition:
            lambda: |-
              return fan_step_percentage(id(selected_fan_speed_pct),
                                         selected_fan_percentage_step(id(selected_fan_index)), -1) == 0;
          then:
            - script.execute: turn_off_selected_fan
          else:
            - lambda: |-
                id(selected_fan_speed_pct) = fan_step_percentage(
                    id(selected_fan_speed_pct), selected_fan_percentage_step(id(selected_fan_index)), -1);
                id(last_fan_speed_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute:
                id: send_setting_value
                kind: !lambda 'return VALUE_SEND_FAN_PERCENTAGE;'
                entity: !lambda 'return id(selected_item_entity);'
                value: !lambda 'return id(selected_fan_speed_pct);'
                value2: !lambda 'return NAN;'
            - script.execute: update_display

  - id: turn_on_selected_humidifier
    mode: queued
    then:
      - homeassistant.action:
          action: humidifier.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "on";
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  - id: turn_off_selected_humidifier
    mode: queued
    then:
      - homeassistant.action:
          action: humidifier.turn_off
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
      - lambda: |-
          id(selected_item_state) = "off";
          id(selected_humidifier_action) = "off";
          note_local_change();
          id(updated_ui) = true;
      - script.execute: update_display

  - id: adjust_humidifier_target
    parameters:
      delta: float
    mode: queued
    then:
      - lambda: |-
          float next = id(selected_humidifier_target_humidity);
          if (isnan(next)) {
            next = 50.0f;
          }
          // Home Assistant rejects a target outside the humidifier's limits.
          next = clamp_humidifier_target(id(selected_humidifier_index), next + delta);
          id(selected_humidifier_target_humidity) = next;
          id(last_humidifier_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - script.execute:
          id: send_setting_value
          kind: !lambda 'return VALUE_SEND_HUMIDIFIER_TARGET;'
          entity: !lambda 'return id(selected_item_entity);'
          value: !lambda 'return id(selected_humidifier_target_humidity);'
          value2: !lambda 'return NAN;'
      - script.execute: update_display

  - id: humidifier_target_up
    mode: queued
    then:
      - script.execute:
          id: adjust_humidifier_target
          delta: 1.0

  - id: humidifier_target_down
    mode: queued
    then:
      - script.execute:
          id: adjust_humidifier_target
          delta: -1.0

  - id: cycle_selected_humidifier_mode_step
    parameters:
      step: int
    mode: queued
    then:
      - lambda: |-
          std::string next_mode = step_delimited_option(
              humidifier_available_modes_for_index(id(selected_humidifier_index)), id(selected_humidifier_mode), step);
          if (next_mode.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_humidifier_mode) = next_mode;
          id(last_humidifier_mode_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - if:
          condition:
            lambda: 'return !id(selected_humidifier_mode).empty();'
          then:
            - homeassistant.action:
                action: humidifier.set_mode
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  mode: !lambda 'return id(selected_humidifier_mode);'
            - script.execute:
                id: set_setting_preview
                text: !lambda 'return esphome::str_upper_case(id(selected_humidifier_mode));'
            - script.execute: update_display

  # While an earlier press is still in flight the tracker holds the old value,
  # so these step from the one this remote last sent (kept in the detail line).
  - id: adjust_light_effect
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_light_index);
          const std::string &current = local_change_hold_active(millis()) && !id(selected_setting_detail).empty()
              ? id(selected_setting_detail)
              : selected_light_effect(idx);
          std::string next = step_delimited_option(selected_light_effect_list(idx), current, step);
          if (!next.empty()) {
            id(set_light_effect).execute(next);
          }

  - id: set_light_effect
    parameters:
      effect: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = effect;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            effect: !lambda 'return effect;'
      - script.execute: update_display

  - id: adjust_fan_preset
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_fan_index);
          const std::string &current = local_change_hold_active(millis()) && !id(selected_setting_detail).empty()
              ? id(selected_setting_detail)
              : fan_preset_mode_for_index(idx);
          std::string next = step_delimited_option(fan_preset_modes_for_index(idx), current, step);
          if (!next.empty()) {
            id(set_fan_preset).execute(next);
          }

  - id: set_fan_preset
    parameters:
      preset: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = preset;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: fan.set_preset_mode
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            preset_mode: !lambda 'return preset;'
      - script.execute: update_display

  - id: set_fan_oscillation
    parameters:
      enabled: bool
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = enabled ? "ON" : "OFF";
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: fan.oscillate
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            oscillating: !lambda 'return enabled;'
      - script.execute: update_display

  - id: set_fan_direction_value
    parameters:
      direction: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = direction;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: fan.set_direction
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            direction: !lambda 'return direction;'
      - script.execute: update_display

  # Plus warmer, Minus cooler, a tenth of the light's range at a time, from
  # the value just sent while Home Assistant hasn't reported it yet.
  - id: adjust_light_warmth
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_light_index);
          uint32_t now = millis();
          float current = pending_value_or(now, REMOTE_MODE_LIGHTS, idx, REMOTE_SETTING_LIGHT_WARMTH,
                                           selected_light_color_temp(idx));
          int next = light_warmth_step(current, selected_light_min_kelvin(idx), selected_light_max_kelvin(idx), step);
          note_pending_value(REMOTE_MODE_LIGHTS, idx, REMOTE_SETTING_LIGHT_WARMTH, next);
          id(last_setting_interaction) = now;
          note_local_change();
          id(updated_ui) = true;
          id(send_setting_value).execute(VALUE_SEND_LIGHT_COLOR_TEMP, id(selected_item_entity), next, NAN);
      - script.execute: update_display

  # COLOR: the next or previous of LIGHT_COLOR_PRESETS, from the one just sent
  # while Home Assistant hasn't reported it, else the nearest to the light's.
  - id: adjust_light_color
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_light_index);
          uint32_t now = millis();
          int current = static_cast<int>(pending_value_or(now, REMOTE_MODE_LIGHTS, idx, REMOTE_SETTING_LIGHT_COLOR,
                                                          selected_light_color_index(idx)));
          int next = light_color_step(current, step);
          note_pending_value(REMOTE_MODE_LIGHTS, idx, REMOTE_SETTING_LIGHT_COLOR, next);
          id(last_setting_interaction) = now;
          note_local_change();
          id(updated_ui) = true;
          id(send_setting_value).execute(VALUE_SEND_LIGHT_COLOR, id(selected_item_entity), next, NAN);
      - script.execute: update_display

  # Vacuums and lawn mowers. Circle starts one, or pauses one at work; Square
  # sends it back to its dock. The state shown is the one asked for until
  # Home Assistant reports.
  - id: vacuum_circle_action
    then:
      - lambda: |-
          const std::string &state = id(selected_item_state);
          if (state.empty()) {
            id(show_toast).execute("SYNCING");
            return;
          }
          int idx = id(selected_vacuum_index);
          bool mower = vacuum_is_mower(idx);
          bool working = vacuum_state_working(state);
          const char *action = working ? (mower ? "lawn_mower.pause" : "vacuum.pause")
                                       : (mower ? "lawn_mower.start_mowing" : "vacuum.start");
          id(selected_item_state) = working ? "paused" : (mower ? "mowing" : "cleaning");
          note_local_change();
          id(updated_ui) = true;
          id(show_toast).execute(working ? "PAUSING..." : "STARTING...");
          id(call_entity_action).execute(
              queue_entity_request(action, id(selected_item_entity), working ? "PAUSE FAILED" : "START FAILED"));

  - id: vacuum_square_action
    then:
      - lambda: |-
          const std::string &state = id(selected_item_state);
          if (state.empty()) {
            id(show_toast).execute("SYNCING");
            return;
          }
          if (state == "docked") {
            id(show_toast).execute("ALREADY DOCKED");
            return;
          }
          bool mower = vacuum_is_mower(id(selected_vacuum_index));
          id(selected_item_state) = "returning";
          note_local_change();
          id(updated_ui) = true;
          id(show_toast).execute("RETURNING...");
          id(call_entity_action).execute(
              queue_entity_request(mower ? "lawn_mower.dock" : "vacuum.return_to_base", id(selected_item_entity),
                                   "DOCK FAILED"));

  # FAN in the footer: the vacuum's fan speeds, from the one just sent while
  # Home Assistant hasn't reported it.
  - id: step_vacuum_fan_speed
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_vacuum_index);
          const std::string &current = local_change_hold_active(millis()) && !id(selected_setting_detail).empty()
              ? id(selected_setting_detail)
              : vacuum_fan_speed_for_index(idx);
          std::string next = step_delimited_option(vacuum_fan_speed_list_for_index(idx), current, step);
          if (next.empty()) {
            return;
          }
          id(selected_setting_detail) = next;
          id(last_setting_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
          id(set_vacuum_fan_speed).execute(next);
      - script.execute: update_display

  - id: set_vacuum_fan_speed
    mode: queued
    parameters:
      fan_speed: std::string
    then:
      - homeassistant.action:
          action: vacuum.set_fan_speed
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            fan_speed: !lambda 'return fan_speed;'
