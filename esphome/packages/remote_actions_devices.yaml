script:
  - id: toggle_selected_light
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "on";'
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "off";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            # No brightness: the light comes back at its last level. The screen
            # shows ON until Home Assistant reports that level.
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "on";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display

  - id: toggle_selected_fan
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "on";'
          then:
            - homeassistant.action:
                action: fan.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "off";
                id(selected_fan_speed_pct) = 0;
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            # No speed: the fan comes back at its last speed. The screen shows ON
            # until Home Assistant reports that speed.
            - homeassistant.action:
                action: fan.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "on";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display

  - id: turn_on_selected_switch
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "on";'
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "ALREADY ON"
            - lambda: 'id(updated_ui) = true;'
            - script.execute: update_display
          else:
            # Hold "turning_on" on screen until Home Assistant has caught up.
            - lambda: |-
                id(last_switch_feedback) = "";
                id(selected_item_state) = "turning_on";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                on_success:
                  - script.execute:
                      id: set_switch_feedback
                      feedback: "SUCCESS"
                on_error:
                  - script.stop: verify_selected_switch_result
                  - script.execute:
                      id: set_switch_feedback
                      feedback: "FAILED"
            - script.execute:
                id: verify_selected_switch_result
                switch_index: !lambda 'return id(selected_switch_index);'
                expected_state: "on"

  - id: turn_off_selected_switch
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "off";'
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "ALREADY OFF"
            - lambda: 'id(updated_ui) = true;'
            - script.execute: update_display
          else:
            # Hold "turning_off" on screen until Home Assistant has caught up.
            - lambda: |-
                id(last_switch_feedback) = "";
                id(selected_item_state) = "turning_off";
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                on_success:
                  - script.execute:
                      id: set_switch_feedback
                      feedback: "SUCCESS"
                on_error:
                  - script.stop: verify_selected_switch_result
                  - script.execute:
                      id: set_switch_feedback
                      feedback: "FAILED"
            - script.execute:
                id: verify_selected_switch_result
                switch_index: !lambda 'return id(selected_switch_index);'
                expected_state: "off"

  # Home Assistant never answers for a switch that fails on its own, so check
  # its state a few seconds after the command went out.
  - id: verify_selected_switch_result
    mode: restart
    parameters:
      switch_index: int
      expected_state: std::string
    then:
      - delay: 5s
      - if:
          condition:
            lambda: |-
              return id(current_mode) == REMOTE_MODE_SWITCHES && id(selected_switch_index) == switch_index &&
                     selected_switch_state(switch_index) != expected_state;
          then:
            - script.execute:
                id: set_switch_feedback
                feedback: "FAILED"

  - id: increase_brightness
    mode: queued
    then:
      - lambda: |-
          int next = id(selected_brightness_pct) + 10;
          if (next > 100) next = 100;
          if (next < 10) next = 10;
          id(selected_brightness_pct) = next;
          id(selected_item_state) = "on";
          id(last_brightness_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            brightness_pct: !lambda 'return id(selected_brightness_pct);'
      - script.execute: update_display

  - id: increase_fan_speed
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return !selected_fan_has_percentage(id(selected_fan_index));'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "on";'
                then:
                  - script.execute: toggle_selected_fan
          else:
            # Step by the fan's own speed increment: on a 3-speed fan a 10% nudge
            # rounds back to the speed it started from.
            - lambda: |-
                int next = (int) lroundf(id(selected_fan_speed_pct) +
                                         selected_fan_percentage_step(id(selected_fan_index)));
                if (next > 100) next = 100;
                id(selected_fan_speed_pct) = next;
                id(selected_item_state) = "on";
                id(last_fan_speed_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: fan.increase_speed
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - script.execute: update_display

  - id: decrease_brightness
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_brightness_pct) <= 10;'
          then:
            - homeassistant.service:
                service: light.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_brightness_pct) = 0;
                id(selected_item_state) = "off";
                id(last_brightness_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - script.execute: update_display
          else:
            - lambda: |-
                int next = id(selected_brightness_pct) - 10;
                if (next < 1) next = 1;
                id(selected_brightness_pct) = next;
                id(selected_item_state) = "on";
                id(last_brightness_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: light.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  brightness_pct: !lambda 'return id(selected_brightness_pct);'
            - script.execute: update_display

  - id: decrease_fan_speed
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return !selected_fan_has_percentage(id(selected_fan_index));'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "on";'
                then:
                  - script.execute: toggle_selected_fan
          else:
            # Home Assistant steps down by the fan's own increment and turns it
            # off below the lowest speed.
            - lambda: |-
                int next = (int) lroundf(id(selected_fan_speed_pct) -
                                         selected_fan_percentage_step(id(selected_fan_index)));
                if (next < 0) next = 0;
                id(selected_fan_speed_pct) = next;
                id(selected_item_state) = next > 0 ? "on" : "off";
                id(last_fan_speed_interaction) = millis();
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: fan.decrease_speed
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - script.execute: update_display

  - id: toggle_selected_humidifier_power
    mode: queued
    then:
      - if:
          condition:
            lambda: 'return id(selected_item_state) == "off";'
          then:
            - homeassistant.action:
                action: humidifier.turn_on
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "on";
                note_local_change();
                id(updated_ui) = true;
          else:
            - homeassistant.action:
                action: humidifier.turn_off
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
            - lambda: |-
                id(selected_item_state) = "off";
                id(selected_humidifier_action) = "off";
                note_local_change();
                id(updated_ui) = true;
      - script.execute: update_display

  - id: adjust_humidifier_target
    parameters:
      delta: float
    mode: queued
    then:
      - lambda: |-
          float next = id(selected_humidifier_target_humidity);
          if (isnan(next)) {
            next = 50.0f;
          }
          next += delta;
          if (next < 0.0f) next = 0.0f;
          if (next > 100.0f) next = 100.0f;
          id(selected_humidifier_target_humidity) = next;
          id(last_humidifier_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: humidifier.set_humidity
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            # Home Assistant coerces humidity to int; a float lambda would send
            # "51.000000", which that coercion rejects.
            humidity: !lambda 'return (int) lroundf(id(selected_humidifier_target_humidity));'
      - script.execute: update_display

  - id: humidifier_target_up
    mode: queued
    then:
      - script.execute:
          id: adjust_humidifier_target
          delta: 1.0

  - id: humidifier_target_down
    mode: queued
    then:
      - script.execute:
          id: adjust_humidifier_target
          delta: -1.0

  - id: cycle_selected_humidifier_mode_step
    parameters:
      step: int
    mode: queued
    then:
      - lambda: |-
          std::string next_mode = step_delimited_option(
              humidifier_available_modes_for_index(id(selected_humidifier_index)), id(selected_humidifier_mode), step);
          if (next_mode.empty()) {
            id(updated_ui) = true;
            return;
          }
          id(selected_humidifier_mode) = next_mode;
          id(last_humidifier_mode_interaction) = millis();
          note_local_change();
          id(updated_ui) = true;
      - if:
          condition:
            lambda: 'return !id(selected_humidifier_mode).empty();'
          then:
            - homeassistant.action:
                action: humidifier.set_mode
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  mode: !lambda 'return id(selected_humidifier_mode);'
            - script.execute:
                id: set_setting_preview
                text: !lambda 'return esphome::str_upper_case(id(selected_humidifier_mode));'
            - script.execute: update_display

  # While an earlier press is still in flight the tracker holds the old value,
  # so these step from the one this remote last sent (kept in the detail line).
  - id: adjust_light_effect
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_light_index);
          const std::string &current = local_change_hold_active(millis()) && !id(selected_setting_detail).empty()
              ? id(selected_setting_detail)
              : selected_light_effect(idx);
          std::string next = step_delimited_option(selected_light_effect_list(idx), current, step);
          if (!next.empty()) {
            id(set_light_effect).execute(next);
          }

  - id: set_light_effect
    parameters:
      effect: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = effect;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            effect: !lambda 'return effect;'
      - script.execute: update_display

  - id: adjust_fan_preset
    parameters:
      step: int
    then:
      - lambda: |-
          int idx = id(selected_fan_index);
          const std::string &current = local_change_hold_active(millis()) && !id(selected_setting_detail).empty()
              ? id(selected_setting_detail)
              : fan_preset_mode_for_index(idx);
          std::string next = step_delimited_option(fan_preset_modes_for_index(idx), current, step);
          if (!next.empty()) {
            id(set_fan_preset).execute(next);
          }

  - id: set_fan_preset
    parameters:
      preset: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = preset;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.action:
          action: fan.set_preset_mode
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            preset_mode: !lambda 'return preset;'
      - script.execute: update_display

  - id: set_fan_oscillation
    parameters:
      enabled: bool
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = enabled ? "ON" : "OFF";
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: fan.oscillate
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            oscillating: !lambda 'return enabled;'
      - script.execute: update_display

  - id: set_fan_direction_value
    parameters:
      direction: std::string
    mode: queued
    then:
      - lambda: |-
          id(last_setting_interaction) = millis();
          id(selected_setting_detail) = direction;
          note_local_change();
          id(updated_ui) = true;
      - homeassistant.service:
          service: fan.set_direction
          data:
            entity_id: !lambda 'return id(selected_item_entity);'
            direction: !lambda 'return direction;'
      - script.execute: update_display
