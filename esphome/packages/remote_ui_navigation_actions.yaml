            - if:
                condition:
                  lambda: 'return step > 0;'
                then:
                  - script.execute: increase_fan_speed
                else:
                  - script.execute: decrease_fan_speed
            - script.execute:
                id: set_setting_preview
                text: !lambda |-
                  char buffer[24];
                  snprintf(buffer, sizeof(buffer), "%d%%", id(selected_fan_speed_pct));
                  return std::string(buffer);
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_FAN_PRESETS;'
          then:
            - script.execute:
                id: adjust_fan_preset
                step: !lambda 'return step > 0 ? 1 : -1;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_FAN_OSCILLATE;'
          then:
            - script.execute:
                id: set_fan_oscillation
                enabled: !lambda 'return step > 0;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_FAN_DIRECTION;'
          then:
            - script.execute:
                id: set_fan_direction_value
                direction: !lambda 'return step > 0 ? std::string("forward") : std::string("reverse");'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_COVER_POSITION;'
          then:
            - if:
                condition:
                  lambda: 'return step > 0;'
                then:
                  - script.execute: increase_cover_position
                else:
                  - script.execute: decrease_cover_position
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_COVER_TILT;'
          then:
            - if:
                condition:
                  lambda: 'return step > 0;'
                then:
                  - script.execute: increase_cover_tilt
                else:
                  - script.execute: decrease_cover_tilt
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_MEDIA_SELECT || id(selected_setting_option) == REMOTE_SETTING_MEDIA_CHANNEL;'
          then:
            - if:
                condition:
                  lambda: 'return step > 0;'
                then:
                  - script.execute: media_next_track
                else:
                  - script.execute: media_previous_track
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_MEDIA_VOLUME;'
          then:
            - if:
                condition:
                  lambda: 'return step > 0;'
                then:
                  - script.execute: media_volume_up
                else:
                  - script.execute: media_volume_down
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_MEDIA_SHUFFLE;'
          then:
            - script.execute:
                id: media_set_shuffle
                enabled: !lambda 'return step > 0;'
      - if:
          # The source list can empty out (a TV turning off) while SOURCE is
          # selected; the lambda's return below can't stop the call after it.
          condition:
            lambda: |-
              return id(selected_setting_option) == REMOTE_SETTING_MEDIA_SOURCE &&
                     media_source_option_count(id(selected_media_index)) > 0;
          then:
            - lambda: |-
                std::string next_source = step > 0
                    ? next_media_source_for_index(id(selected_media_index), id(selected_media_source))
                    : previous_media_source_for_index(id(selected_media_index), id(selected_media_source));
                if (next_source.empty()) {
                  return;
                }
                id(selected_media_source) = next_source;
                id(last_media_source_interaction) = millis();
                id(last_setting_interaction) = millis();
                id(selected_setting_detail) = next_source;
                note_local_change();
                id(updated_ui) = true;
            - homeassistant.service:
                service: media_player.select_source
                data:
                  entity_id: !lambda 'return id(selected_item_entity);'
                  source: !lambda 'return id(selected_media_source);'
            - script.execute: update_display
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_MEDIA_REPEAT;'
          then:
            - script.execute:
                id: cycle_selected_media_repeat
                step: !lambda 'return step > 0 ? 1 : -1;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_MEDIA_SOUND;'
          then:
            - script.execute:
                id: cycle_selected_media_sound_mode
                step: !lambda 'return step > 0 ? 1 : -1;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_ALARM_STATE;'
          then:
            - script.execute:
                id: shift_selected_alarm_arm_mode
                step: !lambda 'return step > 0 ? 1 : -1;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_NOTIFICATION_MESSAGES;'
          then:
            - script.execute:
                id: shift_selected_item
                step: !lambda 'return step > 0 ? 1 : -1;'
                wrap: true
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_WATER_HEATER_TARGET;'
          then:
            - script.execute:
                id: adjust_water_heater_target
                delta: !lambda 'return step > 0 ? 1.0f : -1.0f;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_WATER_HEATER_MODE;'
          then:
            - lambda: |-
                std::string next_mode = step_delimited_option(
                    selected_water_heater_operation_list(id(selected_water_heater_index)),
                    id(selected_water_heater_mode), step);
                if (next_mode.empty()) {
                  return;
                }
                id(set_water_heater_operation_mode).execute(next_mode);
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_WATER_HEATER_AWAY;'
          then:
            - script.execute:
                id: set_water_heater_away_mode
                enabled: !lambda 'return step > 0;'
      - if:
          condition:
            lambda: 'return id(selected_setting_option) == REMOTE_SETTING_WEATHER_CONDITIONS;'
          then:
            - lambda: |-
                int next = id(selected_weather_detail_index) + (step > 0 ? 1 : -1);
                if (next < 0) next = 10;
                if (next > 10) next = 0;
                id(selected_weather_detail_index) = next;
                id(last_setting_interaction) = millis();
                id(updated_ui) = true;
            - script.execute: update_display

  - id: execute_square_button_action
    then:
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_LIGHTS;'
          then:
            - script.execute: turn_off_selected_light
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES;'
          then:
            - script.execute:
                id: turn_off_selected_switch
                switch_index: !lambda 'return id(selected_switch_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_CLIMATE;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "off";'
                then:
                  - script.execute: turn_off_selected_climate
                else:
                  - script.execute:
                      id: show_toast
                      text: "ALREADY OFF"
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_HUMIDIFIERS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "off";'
                then:
                  - script.execute: turn_off_selected_humidifier
                  - script.execute:
                      id: show_toast
                      text: "TURNING OFF"
                else:
                  - script.execute:
                      id: show_toast
                      text: "ALREADY OFF"
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_FANS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "off";'
                then:
                  - script.execute: turn_off_selected_fan
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_COVERS;'
          then:
            - if:
                condition:
                  lambda: 'return selected_cover_stoppable(id(selected_cover_index));'
                then:
                  - script.execute:
                      id: stop_selected_cover
                      cover_index: !lambda 'return id(selected_cover_index);'
                else:
                  - script.execute:
                      id: close_selected_cover
                      cover_index: !lambda 'return id(selected_cover_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_LOCKS;'
          then:
            - script.execute:
                id: unlock_selected_lock
                lock_index: !lambda 'return id(selected_lock_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_MEDIA;'
          then:
            - script.execute: media_square_action
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_WATER_HEATERS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "off";'
                then:
                  - script.execute: water_heater_turn_off_selected
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_ALARMS;'
          then:
            - script.execute: disarm_selected_alarm
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_VACUUMS;'
          then:
            - script.execute: vacuum_square_action
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_TIMERS;'
          then:
            - script.execute: timer_square_action

  - id: execute_circle_button_action
    then:
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_LIGHTS;'
          then:
            - script.execute: turn_on_selected_light
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_SWITCHES;'
          then:
            - script.execute:
                id: turn_on_selected_switch
                switch_index: !lambda 'return id(selected_switch_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_CLIMATE;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "off" || id(selected_item_state) == "unknown";'
                then:
                  - script.execute: turn_on_selected_climate
                else:
                  - script.execute:
                      id: show_toast
                      text: "ALREADY ON"
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_HUMIDIFIERS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "on";'
                then:
                  - script.execute: turn_on_selected_humidifier
                  - script.execute:
                      id: show_toast
                      text: "TURNING ON"
                else:
                  - script.execute:
                      id: show_toast
                      text: "ALREADY ON"
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_FANS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) != "on";'
                then:
                  - script.execute: turn_on_selected_fan
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_COVERS;'
          then:
            - if:
                condition:
                  lambda: 'return selected_cover_stoppable(id(selected_cover_index));'
                then:
                  - script.execute:
                      id: stop_selected_cover
                      cover_index: !lambda 'return id(selected_cover_index);'
                else:
                  - script.execute:
                      id: open_selected_cover
                      cover_index: !lambda 'return id(selected_cover_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_LOCKS;'
          then:
            - script.execute:
                id: lock_selected_lock
                lock_index: !lambda 'return id(selected_lock_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_MEDIA;'
          then:
            - script.execute: media_circle_action
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_WATER_HEATERS;'
          then:
            - if:
                condition:
                  lambda: 'return id(selected_item_state) == "off" || id(selected_item_state) == "unknown";'
                then:
                  - script.execute: water_heater_turn_on_selected
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_AUTOMATION;'
          then:
            - script.execute:
                id: trigger_selected_automation
                automation_index: !lambda 'return id(selected_automation_index);'
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_ALARMS;'
          then:
            - script.execute: arm_selected_alarm_with_selected_mode
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_NOTIFICATIONS;'
          then:
            - script.execute: dismiss_selected_notification
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_VACUUMS;'
          then:
            - script.execute: vacuum_circle_action
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_TIMERS;'
          then:
            - script.execute: timer_circle_action

  # wrap: past the last item comes the first. A held Previous or Next stops
  # at the ends instead (see button_repeat).
  - id: shift_selected_item
    mode: restart
    parameters:
      step: int
      wrap: bool
    then:
      - lambda: |-
          shift_selected_item_moved = false;
          auto selection_refs = make_mode_selection_state_refs(
              id(selected_light_index), id(selected_switch_index), id(selected_climate_index),
              id(selected_water_heater_index), id(selected_lock_index),
              id(selected_cover_index), id(selected_media_index), id(selected_automation_index), id(selected_weather_index),
              id(selected_fan_index), id(selected_humidifier_index), id(selected_sensor_index), id(selected_alarm_index),
              id(selected_notification_index), id(selected_info_index), id(selected_input_index),
              id(selected_vacuum_index), id(selected_timer_index));
          auto selection = resolve_current_ui_selection_context(id(current_mode), id(current_menu_index), selection_refs);
          if (selection.count <= 0 || selection.selected_index == nullptr) {
            return;
          }
          int next = selection.index + step;
          if (!wrap && (next < 0 || next >= selection.count)) {
            return;
          }
          id(last_navigation_requested_at) = millis();
          *selection.selected_index = wrapped_mode_index(selection.index, selection.count, step);
          shift_selected_item_moved = true;
      # The lambda's return can't skip this, so it checks the flag.
      - if:
          condition:
            lambda: 'return shift_selected_item_moved;'
          then:
            - script.execute: update_selected_item

  - id: select_next_item
    then:
      - script.execute:
          id: shift_selected_item
          step: 1
          wrap: true

  - id: select_previous_item
    then:
      - script.execute:
          id: shift_selected_item
          step: -1
          wrap: true

  - id: previous_button_action
    then:
      - script.execute: select_previous_item

  - id: next_button_action
    then:
      - script.execute: select_next_item

  - id: dismiss_selected_notification
    mode: queued
    then:
      - if:
          condition:
            lambda: |-
              int idx = clamp_mode_index(id(selected_notification_index), notification_mode_item_count());
              return notification_mode_item_count() > 0 &&
                     !notification_message_for_index(idx).empty() &&
                     !notification_id_for_index(idx).empty();
          then:
            - homeassistant.service:
                service: persistent_notification.dismiss
                data:
                  notification_id: !lambda |-
                    int idx = clamp_mode_index(id(selected_notification_index), notification_mode_item_count());
                    return notification_id_for_index(idx);
            - lambda: |-
                id(last_notification_dismiss_interaction) = millis();
                id(updated_ui) = true;
            - script.execute: update_display
            - script.execute: refresh_notifications_after_dismiss

  - id: refresh_notifications_after_dismiss
    mode: restart
    then:
      - delay: 3s
      - lambda: |-
          id(last_notification_dismiss_interaction) = 0;
      # Rebuilding while another item is selected would wipe its feedback.
      - if:
          condition:
            lambda: 'return id(current_mode) == REMOTE_MODE_NOTIFICATIONS;'
          then:
            - script.execute: update_selected_item
