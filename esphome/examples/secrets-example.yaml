wifi_ssid: ""
wifi_password: ""
# 32 random bytes, base64-encoded: generate one with `openssl rand -base64 32`.
# It encrypts the Home Assistant connection and also encrypts and authenticates
# OTA firmware uploads, so keep it private.
encryption_key: ""
# Only needed if you uncomment the web_server: block in settings.yaml for
# framebuffer debugging. Both must be non-empty when you do.
web_server_username: ""
web_server_password: ""
# !! USE WITH CARE !!! Optional alarm code for arming/disarming if your alarm integration requires it. If left blank, the remote will attempt to arm/disarm without a code.
alarm_code: ""
